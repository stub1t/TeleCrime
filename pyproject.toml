[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telecrime"
version = "0.1.0"
description = "Telecrime - pipeline for processing stealer logs from Telegram channels"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = []
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "typer>=0.9",
    "telethon>=1.34",
    "tomli-w>=1.0",
    "rich>=13.0",
    "cryptg>=0.5.2",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.1",
    "mypy>=1.8",
]

[project.scripts]
telecrime = "telecrime.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["telecrime"]
include = ["telecrime/web/templates/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# E711/E712: `== None` / `== True` are intentional in SQLAlchemy filters —
# they generate IS NULL / = true SQL and must NOT be rewritten to `is`/`is not`.
ignore = ["E711", "E712"]

[tool.ruff.lint.per-file-ignores]
# Test code patches classes with Mock* locals by convention.
"tests/**" = ["N806"]
# TYPE_CHECKING imports in the lazy model package are for static analyzers only.
"telecrime/models/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
plugins = ["sqlalchemy.ext.mypy.plugin"]
# Non-strict baseline: the codebase is largely untyped. Keep default checks
# enabled so new type errors are visible, and ratchet stricter over time.
strict = false

# Third-party libraries without type stubs / py.typed markers.
[[tool.mypy.overrides]]
module = ["telethon", "telethon.*", "apscheduler", "apscheduler.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["telecrime.adapters.telegram"]
# Telethon is untyped; client calls are Any-heavy and guarded at runtime by
# _ensure_connected(). Keep the rest of the project typed and isolate the noise.
disable_error_code = ["arg-type", "misc", "union-attr", "var-annotated"]

[[tool.mypy.overrides]]
module = ["telecrime.web.app"]
# The FastAPI dashboard is currently a large route/template module with lots of
# dynamic SQL row shapes and framework callback values. Keep mypy enforceable for
# the rest of the codebase while this module is split and typed incrementally.
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "call-overload",
    "import-untyped",
    "index",
    "misc",
    "type-var",
    "union-attr",
    "var-annotated",
]
