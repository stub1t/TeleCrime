services:
  db:
    image: postgres:16-alpine
    command: >
      postgres
      -c shared_buffers=${TELECRIME_POSTGRES_SHARED_BUFFERS:-128MB}
      -c effective_cache_size=${TELECRIME_POSTGRES_EFFECTIVE_CACHE_SIZE:-4GB}
      -c work_mem=${TELECRIME_POSTGRES_WORK_MEM:-4MB}
      -c maintenance_work_mem=${TELECRIME_POSTGRES_MAINTENANCE_WORK_MEM:-64MB}
      -c max_wal_size=${TELECRIME_POSTGRES_MAX_WAL_SIZE:-1GB}
      -c statement_timeout=${TELECRIME_POSTGRES_STATEMENT_TIMEOUT:-5min}
      -c lock_timeout=${TELECRIME_POSTGRES_LOCK_TIMEOUT:-30s}
      -c idle_in_transaction_session_timeout=${TELECRIME_POSTGRES_IDLE_TRANSACTION_TIMEOUT:-10min}
    environment:
      POSTGRES_DB: telecrime
      POSTGRES_USER: telecrime
      POSTGRES_PASSWORD: ${TELECRIME_POSTGRES_PASSWORD:-telecrime}
    ports:
      - "${TELECRIME_POSTGRES_PORT:-5432}:5432"
    shm_size: ${TELECRIME_POSTGRES_SHM_SIZE:-1g}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telecrime"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run python -m telecrime dashboard --host 0.0.0.0 --port 8000"
    ports:
      - "${TELECRIME_WEB_PORT:-8000}:8000"
    volumes:
      - "${TELECRIME_DATA_DIR:-./data}:/app/data"
    environment:
      TELECRIME_DATABASE_URL: "postgresql://telecrime:${TELECRIME_POSTGRES_PASSWORD:-telecrime}@db:5432/telecrime"
      TELECRIME_DATA_DIR: /app/data
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    build: .
    command: ["uv", "run", "python", "-m", "telecrime", "worker"]
    stop_grace_period: ${TELECRIME_WORKER_STOP_GRACE_PERIOD:-5m}
    volumes:
      - "${TELECRIME_DATA_DIR:-./data}:/app/data"
    environment:
      TELECRIME_DATABASE_URL: "postgresql://telecrime:${TELECRIME_POSTGRES_PASSWORD:-telecrime}@db:5432/telecrime"
      TELECRIME_DATA_DIR: /app/data
      TELECRIME_PIPELINE_STALE_SECONDS: ${TELECRIME_PIPELINE_STALE_SECONDS:-1200}
      TELECRIME_READY_GROUP_CONCURRENCY: ${TELECRIME_READY_GROUP_CONCURRENCY:-3}
      TELECRIME_PARSE_WORKERS: ${TELECRIME_PARSE_WORKERS:-}
    env_file:
      - path: .env
        required: false
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    name: ${TELECRIME_POSTGRES_VOLUME:-telecrime_postgres_data}
