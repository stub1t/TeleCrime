<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title or "Telecrime Dashboard" }}</title>
    <script src="/static/chart.min.js"></script>
    <script src="/static/htmx.min.js"></script>
    <script src="/static/alpine.min.js" defer></script>
    <style>
      /* ============================================================
         Telecrime Dashboard — design system
         ============================================================ */
      :root {
        --bg:            #0b0f14;
        --bg-elevated:   #10161d;
        --panel:         #131a22;
        --panel-2:       #182029;
        --panel-alt:     #182029;
        --border:        #232e3a;
        --border-strong: #31404f;
        --text:          #dce6ee;
        --text-2:        #9fb0bf;
        --muted:         #64788c;
        --accent:        #34d399;
        --accent-2:      #38bdf8;
        --danger:        #f87171;
        --warn:          #fbbf24;
        --success:       #34d399;
        --sidebar-w:     220px;
        --radius:        10px;
        --radius-sm:     6px;
        --shadow:        0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
        --font:          -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --mono:          "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      }
      [data-theme="light"] {
        --bg:            #f4f6f8;
        --bg-elevated:   #ffffff;
        --panel:         #ffffff;
        --panel-2:       #eef2f5;
        --panel-alt:     #eef2f5;
        --border:        #d9e1e8;
        --border-strong: #c3ced7;
        --text:          #1a2430;
        --text-2:        #4a5a6a;
        --muted:         #8296a6;
        --accent:        #0d9668;
        --accent-2:      #0369a1;
        --danger:        #dc2626;
        --warn:          #a16207;
        --success:       #0d9668;
        --shadow:        0 1px 3px rgba(15,23,42,.08), 0 4px 16px rgba(15,23,42,.06);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        line-height: 1.5;
        min-height: 100vh;
      }
      a { color: var(--accent-2); text-decoration: none; }
      a:hover { text-decoration: underline; }
      code, .code { font-family: var(--mono); font-size: .92em; }

      /* ── Layout ─────────────────────────────────────────────── */
      .layout {
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        width: var(--sidebar-w);
        flex-shrink: 0;
        background: var(--bg-elevated);
        border-right: 1px solid var(--border);
        padding: 20px 14px;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .main {
        flex: 1;
        min-width: 0;
        padding: 26px 30px 80px 30px;
        max-width: 1440px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 4px 8px 18px 8px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 14px;
      }
      .brand-dot {
        width: 10px; height: 10px;
        border-radius: 3px;
        background: var(--accent);
        box-shadow: 0 0 12px var(--accent);
        flex-shrink: 0;
      }
      .brand-name {
        font-weight: 700;
        font-size: 15px;
        letter-spacing: .01em;
      }
      .brand-sub {
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: .14em;
      }
      .nav-section {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: .12em;
        color: var(--muted);
        padding: 14px 10px 5px 10px;
      }
      .nav-link {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border-radius: var(--radius-sm);
        color: var(--text-2);
        font-size: 13px;
        text-decoration: none;
        transition: background .12s, color .12s;
      }
      .nav-link:hover { background: var(--panel-2); color: var(--text); text-decoration: none; }
      .nav-link.active {
        background: color-mix(in srgb, var(--accent) 12%, transparent);
        color: var(--accent);
        font-weight: 600;
      }
      .nav-link svg { width: 16px; height: 16px; flex-shrink: 0; opacity: .8; }
      .nav-badge {
        margin-left: auto;
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 999px;
        background: var(--danger);
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse { 0%,100% {opacity:1} 50% {opacity:.65} }
      .sidebar-footer {
        margin-top: auto;
        padding-top: 14px;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .theme-toggle {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--muted);
        cursor: pointer;
        width: 32px; height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .theme-toggle:hover { color: var(--accent); border-color: var(--accent); }
      .theme-toggle svg { width: 16px; height: 16px; fill: currentColor; }

      /* Mobile nav */
      .mobile-nav {
        display: none;
        position: sticky;
        top: 0;
        z-index: 40;
        background: var(--bg-elevated);
        border-bottom: 1px solid var(--border);
        padding: 10px 14px;
        gap: 6px;
        overflow-x: auto;
      }
      .mobile-nav a {
        padding: 6px 10px;
        border-radius: var(--radius-sm);
        color: var(--text-2);
        font-size: 13px;
        white-space: nowrap;
      }
      .mobile-nav a.active { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }

      /* ── Page header ────────────────────────────────────────── */
      .page-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }
      .page-head h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -.01em;
      }
      .page-head p { margin: 4px 0 0 0; color: var(--muted); font-size: 13px; }
      /* Legacy aliases */
      .page-intro { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
      .page-intro-copy h2 { margin: 0; font-size: 22px; font-weight: 700; }
      .page-intro-copy p { margin: 4px 0 0 0; color: var(--muted); font-size: 13px; }
      .page-header { margin-bottom: 16px; }
      .page-header h2 { margin: 0 0 4px 0; font-size: 20px; font-weight: 700; }
      .page-header p { margin: 0; color: var(--muted); font-size: 13px; }
      .mini-note {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--panel);
        color: var(--muted);
        font-size: 12px;
      }

      /* ── KPI cards ──────────────────────────────────────────── */
      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 12px;
        margin-bottom: 22px;
      }
      .kpi {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px 16px;
        box-shadow: var(--shadow);
      }
      .kpi .kpi-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: .08em;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .kpi .kpi-value {
        font-size: 24px;
        font-weight: 700;
        font-family: var(--mono);
        margin-top: 6px;
        letter-spacing: -.02em;
      }
      .kpi .kpi-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
      .kpi .kpi-value.accent { color: var(--accent); }
      .kpi .kpi-value.accent2 { color: var(--accent-2); }
      .kpi .kpi-value.danger { color: var(--danger); }
      .kpi .kpi-value.warn { color: var(--warn); }

      /* ── Cards / panels ─────────────────────────────────────── */
      .card, .panel, .section {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }
      .card { padding: 16px; }
      .panel { padding: 14px; }
      .section { padding: 18px; margin-top: 22px; }
      .card h3, .panel h3, .section > h2 {
        margin: 0 0 12px 0;
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: .07em;
        color: var(--muted);
      }
      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 16px;
      }
      .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .search-panels {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 16px;
        margin-bottom: 16px;
      }

      /* ── Tables ─────────────────────────────────────────────── */
      .table-wrap {
        overflow-x: auto;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--panel);
      }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td {
        text-align: left;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }
      tbody tr:last-child td { border-bottom: none; }
      th {
        background: var(--panel-2);
        color: var(--muted);
        font-weight: 600;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: .06em;
        white-space: nowrap;
      }
      td { color: var(--text); }
      tbody tr { transition: background .1s; }
      tbody tr:hover { background: color-mix(in srgb, var(--accent) 5%, transparent); }
      td a { color: var(--accent-2); font-weight: 500; }
      td .code { font-size: .92em; }
      th[data-sort] { cursor: pointer; user-select: none; }
      th[data-sort]:hover { color: var(--accent); }
      th[data-sort]::after { content: ""; margin-left: 4px; opacity: .4; }
      th[data-sort].sort-asc::after { content: "▲"; opacity: 1; }
      th[data-sort].sort-desc::after { content: "▼"; opacity: 1; }

      /* ── Badges / pills ─────────────────────────────────────── */
      .pill, .stealer-badge {
        display: inline-flex;
        align-items: center;
        padding: 2px 9px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--accent-2) 14%, transparent);
        color: var(--accent-2);
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: .05em;
        white-space: nowrap;
      }
      .filter-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 11px;
        border-radius: 999px;
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--text-2);
        font-size: 12px;
        text-decoration: none;
      }
      .filter-pill:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }
      .filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 16px 0; }

      /* ── Buttons ────────────────────────────────────────────── */
      button, .btn {
        font-family: var(--font);
        font-size: 13px;
        padding: 8px 14px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
        transition: border-color .15s, color .15s, background .15s;
      }
      button:hover { border-color: var(--accent); color: var(--accent); }
      .btn-primary, .search-bar button, .hero-form button, .adv-apply {
        background: var(--accent);
        border-color: var(--accent);
        color: #06251a;
        font-weight: 600;
      }
      .btn-primary:hover { background: color-mix(in srgb, var(--accent) 85%, #fff); color: #06251a; }

      /* ── Forms ──────────────────────────────────────────────── */
      input[type="text"], input[type="search"], input[type="number"], select {
        padding: 8px 12px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--panel-2);
        color: var(--text);
        font-family: var(--font);
        font-size: 13px;
        outline: none;
        transition: border-color .15s;
      }
      input:focus, select:focus { border-color: var(--accent); }
      label { font-size: 12px; color: var(--muted); }

      /* ── Search bar ─────────────────────────────────────────── */
      .search-bar {
        display: flex;
        gap: 10px;
        margin: 0 0 14px 0;
        flex-wrap: wrap;
        align-items: flex-end;
      }
      .search-bar input[type="text"] { flex: 1; min-width: 240px; padding: 10px 14px; }
      .search-bar label { display: flex; flex-direction: column; gap: 4px; }
      .search-meta { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 0 0 16px 0; }
      .search-bar a {
        display: inline-flex;
        align-items: center;
        padding: 9px 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text-2);
        text-decoration: none;
        font-weight: 500;
      }
      .search-bar a:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }

      /* Advanced options */
      .advanced-toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--muted);
        font-size: 13px;
        cursor: pointer;
        padding: 7px 12px;
      }
      .advanced-toggle:hover { color: var(--accent); border-color: var(--accent); }
      .advanced-toggle svg { width: 14px; height: 14px; }
      .adv-panel {
        display: none;
        flex-direction: column;
        gap: 18px;
        margin: 12px 0;
        padding: 18px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
      }
      .adv-panel.open { display: flex; }
      .adv-section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 10px; }
      .adv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
      .adv-field { display: flex; flex-direction: column; gap: 4px; }
      .adv-field input[type="number"] { width: 100%; }
      .adv-toggles { display: flex; gap: 10px; flex-wrap: wrap; }
      .adv-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 12px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--panel-2);
        color: var(--muted);
        font-size: 13px;
        cursor: pointer;
        user-select: none;
      }
      .adv-chip input[type="checkbox"] { display: none; }
      .adv-chip svg { width: 14px; height: 14px; opacity: .6; }
      .adv-chip.active { border-color: var(--accent); color: var(--accent); }
      .adv-chip.active svg { opacity: 1; }
      .adv-actions { display: flex; gap: 10px; align-items: center; padding-top: 4px; border-top: 1px solid var(--border); }
      .adv-reset { background: transparent; }
      .save-form { display: flex; gap: 8px; flex-wrap: wrap; }
      .save-form input[type="text"] { flex: 1; min-width: 160px; }

      /* ── Status bar / misc ──────────────────────────────────── */
      .bar { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; min-width: 60px; }
      .bar-fill { height: 100%; background: var(--accent); border-radius: 3px; }
      .empty { color: var(--muted); padding: 14px 0; font-size: 13px; }
      .muted { color: var(--muted); }
      .spinner {
        width: 18px; height: 18px;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin .6s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .search-loading { display: none; align-items: center; justify-content: center; gap: 10px; padding: 24px 0; color: var(--muted); }
      .search-loading.active { display: flex; }

      /* Export buttons */
      .export-bar { display: flex; gap: 6px; flex-wrap: wrap; }
      .export-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 5px 10px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
        text-decoration: none;
      }
      .export-btn:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }
      .export-btn svg { width: 13px; height: 13px; }

      /* Pagination */
      .pw-pagination { display: flex; gap: 6px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
      .pw-page-btn {
        padding: 6px 12px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text-2);
        font-size: 13px;
        text-decoration: none;
      }
      .pw-page-btn:hover, .pw-page-btn.active { border-color: var(--accent); color: var(--accent); text-decoration: none; }

      /* Watchlist */
      .watchlist-alert-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
      .watchlist-alert-card {
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding: 12px 14px;
        border: 1px solid color-mix(in srgb, var(--danger) 55%, var(--border));
        border-radius: var(--radius-sm);
        background: var(--panel);
        text-decoration: none;
        color: var(--text);
        transition: border-color .15s, background .15s;
      }
      .watchlist-alert-card:hover { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 8%, transparent); text-decoration: none; }
      .watchlist-alert-count { font-size: 20px; font-weight: 700; color: var(--danger); font-family: var(--mono); }
      .watchlist-alert-label { font-size: 13px; font-weight: 600; }
      .watchlist-alert-query { font-size: 11px; color: var(--muted); }

      /* Copy buttons in credential tables */
      .cred-copy-sm {
        background: none;
        border: 1px solid var(--border);
        border-radius: 4px;
        color: var(--muted);
        cursor: pointer;
        padding: 2px 4px;
        line-height: 1;
        opacity: 0;
        transition: opacity .15s, border-color .15s, color .15s;
      }
      tr:hover .cred-copy-sm { opacity: 1; }
      .cred-copy-sm:hover { border-color: var(--accent); color: var(--accent); }
      .cred-copy-sm svg { width: 12px; height: 12px; display: block; }

      /* Stat chips (legacy, mapped to KPI look) */
      .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 0 0 20px 0; }
      .stat-chip {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px 16px;
        box-shadow: var(--shadow);
      }
      .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
      .stat-value { font-size: 22px; font-weight: 700; font-family: var(--mono); margin-top: 6px; }

      /* Hero (search landing) */
      .hero-search {
        text-align: center;
        padding: 44px 28px 36px 28px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius);
        background: var(--panel);
        box-shadow: var(--shadow);
      }
      .hero-kicker { margin: 0 0 10px 0; font-size: 11px; text-transform: uppercase; letter-spacing: .18em; color: var(--accent); font-weight: 700; }
      .hero-heading { font-size: 30px; font-weight: 700; margin: 0 0 8px 0; letter-spacing: -.02em; }
      .hero-sub { color: var(--muted); font-size: 14px; margin: 0 0 24px 0; }
      .hero-form { display: flex; max-width: 640px; margin: 0 auto; }
      .hero-form input[type="text"] {
        flex: 1;
        padding: 13px 16px;
        font-size: 15px;
        border: 1px solid var(--border);
        border-right: none;
        border-radius: var(--radius-sm) 0 0 var(--radius-sm);
        background: var(--bg);
        color: var(--text);
        outline: none;
      }
      .hero-form button { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; padding: 13px 22px; }
      .hero-hints { margin-top: 14px; font-size: 13px; color: var(--muted); display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      .hero-hints a {
        color: var(--accent-2);
        text-decoration: none;
        padding: 3px 10px;
        border-radius: 999px;
        background: var(--panel-2);
        border: 1px solid var(--border);
        font-size: 12px;
      }
      .hero-hints a:hover { border-color: var(--accent); }

      /* ── Scheduler job cards ───────────────────────────────── */
      .job-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; margin-top: 20px; }
      .job-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        box-shadow: var(--shadow);
      }
      .job-card.running { border-color: var(--accent); }
      .job-card.error { border-color: var(--danger); }
      .job-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .job-name { font-size: 15px; font-weight: 600; text-transform: capitalize; }
      .job-badge {
        display: inline-flex; align-items: center; gap: 5px;
        font-size: 11px; padding: 3px 10px; border-radius: 999px; font-weight: 600; letter-spacing: .04em;
      }
      .badge-running { background: color-mix(in srgb, var(--success) 15%, transparent); color: var(--success); }
      .badge-ok { background: color-mix(in srgb, var(--success) 10%, transparent); color: var(--success); }
      .badge-error { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }
      .badge-disabled { background: var(--panel-2); color: var(--muted); }
      .badge-pending { background: color-mix(in srgb, var(--accent-2) 10%, transparent); color: var(--accent-2); }
      .job-desc { font-size: 13px; color: var(--muted); line-height: 1.5; }
      .job-meta { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
      .meta-row { display: flex; gap: 8px; }
      .meta-label { min-width: 90px; color: var(--muted); }
      .meta-value { color: var(--text); font-family: var(--mono); font-size: 11px; word-break: break-all; }
      .meta-value.ok { color: var(--success); }
      .meta-value.err { color: var(--danger); }
      .trigger-btn {
        margin-top: auto; padding: 8px 14px; border-radius: var(--radius-sm);
        border: 1px solid var(--accent); background: transparent; color: var(--accent);
        font-size: 13px; font-weight: 600; cursor: pointer; align-self: flex-start;
      }
      .trigger-btn:hover { background: var(--accent); color: #06251a; }
      .trigger-btn:disabled { opacity: .4; cursor: not-allowed; border-color: var(--border); color: var(--muted); }
      .interval-badge {
        display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: var(--radius-sm);
        background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
      }
      .flash {
        padding: 11px 14px; border-radius: var(--radius-sm); margin-bottom: 16px; font-size: 13px;
        border: 1px solid var(--success); background: color-mix(in srgb, var(--success) 8%, transparent); color: var(--success);
      }
      .flash.err { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 8%, transparent); color: var(--danger); }
      .spinner-inline {
        display: inline-block; width: 12px; height: 12px;
        border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%;
        animation: spin .6s linear infinite; vertical-align: middle;
      }
      .pipeline-activity {
        background: var(--panel); border: 1px solid var(--accent); border-radius: var(--radius);
        padding: 18px 20px; margin-bottom: 20px; display: none; box-shadow: var(--shadow);
      }
      .pipeline-activity.visible { display: block; }
      .pipeline-activity-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
      .pipeline-activity-title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
      .pipeline-elapsed { font-size: 12px; color: var(--muted); font-family: var(--mono); }
      .stage-dots { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
      .stage-dot {
        display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 3px 8px;
        border-radius: 999px; border: 1px solid var(--border); color: var(--muted); background: var(--panel-2); white-space: nowrap;
      }
      .stage-dot.done { border-color: var(--success); color: var(--success); background: color-mix(in srgb, var(--success) 8%, transparent); }
      .stage-dot.active { border-color: var(--accent-2); color: var(--accent-2); background: color-mix(in srgb, var(--accent-2) 12%, transparent); font-weight: 600; }
      .stage-dot.failed { border-color: var(--danger); color: var(--danger); background: color-mix(in srgb, var(--danger) 8%, transparent); }
      .pipeline-stats { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 12px; font-size: 13px; }
      .pipeline-stat { display: flex; flex-direction: column; gap: 2px; }
      .pipeline-stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
      .pipeline-stat-value { font-size: 18px; font-weight: 600; font-family: var(--mono); }
      .pipeline-archive { font-size: 12px; color: var(--muted); margin-bottom: 8px; font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .pipeline-dl-bar { height: 4px; background: var(--panel-2); border-radius: 999px; overflow: hidden; margin-bottom: 10px; display: none; }
      .pipeline-dl-bar.active { display: block; }
      .pipeline-dl-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 999px; transition: width .5s; }
      .pipeline-queue-bar { height: 6px; background: var(--panel-2); border-radius: 999px; overflow: hidden; margin-bottom: 6px; display: none; }
      .pipeline-queue-bar.active { display: block; }
      .pipeline-queue-fill { height: 100%; background: var(--muted); border-radius: 999px; transition: width 1s; }
      .pipeline-queue-label { font-size: 11px; color: var(--muted); margin-bottom: 10px; display: none; }
      .pipeline-queue-label.active { display: flex; justify-content: space-between; }
      .pipeline-results { font-size: 12px; color: var(--muted); font-family: var(--mono); display: flex; flex-direction: column; gap: 3px; }
      .pipeline-results span:last-child { color: var(--text); }

      /* ── Watchlist page ─────────────────────────────────────── */
      .wl-add-form {
        display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end;
        padding: 16px 18px; border: 1px solid var(--border); border-radius: var(--radius);
        background: var(--panel); margin-bottom: 18px; box-shadow: var(--shadow);
      }
      .wl-field { display: flex; flex-direction: column; gap: 4px; }
      .wl-field label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
      .wl-field.grow { flex: 1; min-width: 160px; }
      .wl-add-btn { background: var(--accent); color: #06251a; font-weight: 600; border: none; padding: 10px 18px; }
      .wl-new-badge {
        display: inline-flex; align-items: center; justify-content: center;
        min-width: 24px; height: 22px; padding: 0 6px; border-radius: 999px;
        background: var(--danger); color: #fff; font-size: 12px; font-weight: 700;
        animation: pulse 2s ease-in-out infinite;
      }
      .wl-actions { display: flex; gap: 6px; }
      .wl-btn {
        padding: 5px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border);
        background: transparent; color: var(--muted); font-size: 12px; cursor: pointer;
        text-decoration: none;
      }
      .wl-btn:hover { border-color: var(--accent); color: var(--accent); }
      .wl-btn.danger:hover { border-color: var(--danger); color: var(--danger); }
      .wl-toggle {
        width: 38px; height: 20px; border-radius: 999px; border: 1px solid var(--border);
        background: var(--panel-2); cursor: pointer; position: relative; flex-shrink: 0;
      }
      .wl-toggle.on { background: color-mix(in srgb, var(--success) 20%, transparent); border-color: var(--success); }
      .wl-toggle::after {
        content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
        border-radius: 50%; background: var(--muted); transition: transform .2s, background .2s;
      }
      .wl-toggle.on::after { transform: translateX(18px); background: var(--success); }
      .match-type-pill {
        display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: var(--radius-sm);
        background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
        text-transform: uppercase; letter-spacing: .04em;
      }

      /* ── Conversation detail ────────────────────────────────── */
      .conv-meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
      .conv-stat {
        background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
        padding: 14px 18px; text-align: center; box-shadow: var(--shadow);
      }
      .conv-stat-value { font-size: 26px; font-weight: 700; color: var(--accent); font-family: var(--mono); }
      .conv-stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-top: 4px; }
      .msg-row { border-bottom: 1px solid var(--border); padding: 10px 0; }
      .msg-row:last-child { border-bottom: none; }
      .msg-ts { font-size: 11px; color: var(--muted); white-space: nowrap; font-family: var(--mono); }
      .msg-text { font-size: 13px; margin-top: 4px; white-space: pre-wrap; word-break: break-word; max-height: 80px; overflow: hidden; }
      .msg-fwd { font-size: 11px; color: var(--muted); font-style: italic; }

      /* Alert banner */
      .alert-banner {
        margin: 0 0 16px 0;
        padding: 11px 14px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--warn);
        background: color-mix(in srgb, var(--warn) 8%, transparent);
        color: var(--warn);
        font-size: 13px;
        line-height: 1.45;
      }

      @media (max-width: 860px) {
        .layout { flex-direction: column; }
        .sidebar { display: none; }
        .mobile-nav { display: flex; }
        .main { padding: 18px 14px 60px 14px; }
        .two-col { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="mobile-nav">
      <a href="/">Home</a>
      <a href="/search">Search</a>
      <a href="/watchlist">Watchlist</a>
      <a href="/scheduler">Pipeline</a>
      <a href="/passwords">Passwords</a>
      <a href="/conversations">Convs</a>
      <a href="/channels">Channels</a>

      <a href="/stats">Stats</a>
    </div>

    <div class="layout">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-dot"></span>
          <div>
            <div class="brand-name">Telecrime</div>
            <div class="brand-sub">Operator Console</div>
          </div>
        </div>

        <div class="nav-section">Overview</div>
        <a class="nav-link" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>Home</a>
        <a class="nav-link" href="/search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>Search</a>
        <a class="nav-link" href="/watchlist" id="navWatchlist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/></svg>Watchlist<span id="watchlistBadge" class="nav-badge" style="display:none"></span></a>

        <div class="nav-section">Operations</div>

        <a class="nav-link" href="/triage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l2 2"/></svg>Triage</a>
        <a class="nav-link" href="/stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>Analytics</a>

        <div class="nav-section">Data</div>
        <a class="nav-link" href="/passwords"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Passwords</a>
        <a class="nav-link" href="/conversations"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Conversations</a>

        <div class="sidebar-footer">
          <span class="mini-note" style="padding:4px 10px;font-size:11px;">Telecrime</span>
          <button id="themeToggle" class="theme-toggle" title="Toggle theme">
            <svg id="iconDark" viewBox="0 0 24 24" style="display:none"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>

            <svg id="iconSystem" viewBox="0 0 24 24" style="display:none"><path d="M20 3H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h3l-1 1v2h12v-2l-1-1h3c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 13H4V5h16v11z"/></svg>
          </button>
        </div>
      </aside>

      <main class="main">
        {% block content %}{% endblock %}
      </main>
    </div>

    <script>
      /* --- Clipboard helper --- */
      window.copyToClipboard = function(text) {
        if (navigator.clipboard && window.isSecureContext) {
          return navigator.clipboard.writeText(text);
        }
        var el = document.createElement('textarea');
        el.value = text;
        el.style.cssText = 'position:absolute;left:-9999px;top:-9999px';
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
        return Promise.resolve();
      };

      /* --- Chart.js shared theme helper --- */
      (function() {
        const cs = () => getComputedStyle(document.documentElement);
        window.tcChartColors = () => ({
          accent: cs().getPropertyValue('--accent').trim(),
          accent2: cs().getPropertyValue('--accent-2').trim(),
          danger: cs().getPropertyValue('--danger').trim(),
          muted: cs().getPropertyValue('--muted').trim(),
          text: cs().getPropertyValue('--text').trim(),
          border: cs().getPropertyValue('--border').trim(),
          panel: cs().getPropertyValue('--panel').trim(),
        });
        window.tcChartDefaults = () => {
          const c = tcChartColors();
          return {
            color: c.muted,
            borderColor: c.border,
            plugins: { legend: { labels: { color: c.muted } } },
            scales: {
              x: { ticks: { color: c.muted }, grid: { color: c.border } },
              y: { ticks: { color: c.muted }, grid: { color: c.border } },
            },
          };
        };
      })();

      /* --- Active nav link --- */
      (function() {
        var path = location.pathname;
        document.querySelectorAll('.nav-link, .mobile-nav a').forEach(function(a) {
          var href = a.getAttribute('href');
          if (href === '/' ? path === '/' : path === href || path.startsWith(href + '/')) {
            a.classList.add('active');
          }
        });
      })();

      /* --- Sortable tables --- */
      (function() {
        function sortTable(table, colIdx, dir) {
          const tbody = table.querySelector('tbody');
          if (!tbody) return;
          const rows = Array.from(tbody.rows);
          rows.sort((a, b) => {
            let av = (a.cells[colIdx] || {}).textContent || '';
            let bv = (b.cells[colIdx] || {}).textContent || '';
            av = av.trim(); bv = bv.trim();
            const an = parseFloat(av.replace(/[,%]/g, '')), bn = parseFloat(bv.replace(/[,%]/g, ''));
            if (!isNaN(an) && !isNaN(bn)) return dir === 'asc' ? an - bn : bn - an;
            return dir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
          });
          rows.forEach(r => tbody.appendChild(r));
        }
        document.addEventListener('click', function(e) {
          const th = e.target.closest('th[data-sort]');
          if (!th) return;
          const table = th.closest('table');
          const idx = Array.from(th.parentElement.children).indexOf(th);
          const wasAsc = th.classList.contains('sort-asc');
          table.querySelectorAll('th[data-sort]').forEach(h => h.classList.remove('sort-asc','sort-desc'));
          const dir = wasAsc ? 'desc' : 'asc';
          th.classList.add('sort-' + dir);
          sortTable(table, idx, dir);
        });
        document.querySelectorAll('table[data-sortable] th').forEach(th => {
          if (!th.hasAttribute('data-sort')) th.setAttribute('data-sort', '');
        });
      })();

      /* --- Keyboard shortcuts --- */
      document.addEventListener('keydown', function(e) {
        if (e.key === '/' && !e.ctrlKey && !e.metaKey) {
          const active = document.activeElement;
          if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT')) return;
          const input = document.querySelector('input[name="q"]');
          if (input) { e.preventDefault(); input.focus(); input.select(); }
        }
        if (e.key === 'Escape') {
          if (document.activeElement) document.activeElement.blur();
        }
      });

      /* --- Watchlist nav badge --- */
      (function() {
        function updateBadge() {
          fetch('/api/watchlist/badge')
            .then(function(r) { return r.json(); })
            .then(function(d) {
              var badge = document.getElementById('watchlistBadge');
              if (!badge) return;
              if (d.new_count > 0) {
                badge.textContent = d.new_count;
                badge.style.display = 'inline-flex';
              } else {
                badge.style.display = 'none';
              }
            })
            .catch(function() {});
        }
        updateBadge();
        setInterval(updateBadge, 30000);
      })();

      /* --- Theme toggle --- */
      (function () {
        const root = document.documentElement;
        const btn = document.getElementById("themeToggle");
        const icons = { dark: document.getElementById("iconDark"), light: document.getElementById("iconLight"), system: document.getElementById("iconSystem") };
        const cycle = ["dark", "light", "system"];
        let current = localStorage.getItem("telecrime-theme") || "system";
        const mq = window.matchMedia("(prefers-color-scheme: light)");

        function resolve(theme) {
          return theme === "system" ? (mq.matches ? "light" : "dark") : theme;
        }

        function apply(theme) {
          const resolved = resolve(theme);
          if (resolved === "light") {
            root.setAttribute("data-theme", "light");
          } else {
            root.removeAttribute("data-theme");
          }
          Object.keys(icons).forEach(k => icons[k].style.display = k === theme ? "block" : "none");
          btn.title = theme === "system" ? "Theme: System" : theme === "dark" ? "Theme: Dark" : "Theme: Light";
        }

        apply(current);

        btn.addEventListener("click", () => {
          current = cycle[(cycle.indexOf(current) + 1) % cycle.length];
          localStorage.setItem("telecrime-theme", current);
          apply(current);
        });

        mq.addEventListener("change", () => {
          if (current === "system") apply(current);
        });
      })();
    </script>
  </body>
</html>
