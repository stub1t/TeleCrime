<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title or "Telecrime Dashboard" }}</title>
    <script src="/static/chart.min.js"></script>
    <script src="/static/htmx.min.js"></script>
    <script src="/static/alpine.min.js" defer></script>
    <style>
      :root {
        --bg:            #080d09;
        --panel:         #0d1410;
        --panel-alt:     #0a1109;
        --panel-soft:    #0d1410;
        --text:          #c8e8d8;
        --muted:         #4a7c60;
        --accent:        #00ff9f;
        --accent-2:      #00ccff;
        --danger:        #ff4f4f;
        --warn:          #ffcc00;
        --border:        #1a3020;
        --border-strong: #2a4832;
        --header-bg:     #0a0f0a;
        --surface:       #080d09;
        --shadow:        none;
      }
      [data-theme="light"] {
        --bg:            #f0f4f0;
        --panel:         #e8efe8;
        --panel-alt:     #dde8dd;
        --panel-soft:    #e8efe8;
        --text:          #0a3020;
        --muted:         #3a6848;
        --accent:        #007040;
        --accent-2:      #005878;
        --danger:        #cc2020;
        --warn:          #887000;
        --border:        #a8c8a8;
        --border-strong: #80a880;
        --header-bg:     #e4ece4;
        --surface:       #f0f4f0;
        --shadow:        none;
      }
      * { box-sizing: border-box; border-radius: 0 !important; }
      .spinner { border-radius: 50% !important; }
      body {
        margin: 0;
        font-family: "Cascadia Code","JetBrains Mono","Fira Code","Courier New",monospace;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        font-size: 13px;
      }
      header {
        padding: 12px 24px 14px 24px;
        border-bottom: 1px solid var(--border-strong);
        background: var(--header-bg);
        position: sticky;
        top: 0;
        z-index: 20;
      }
      .header-row {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }
      .brand-mark {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .brand-badge {
        width: 8px;
        height: 8px;
        background: var(--accent);
      }
      .brand-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        color: var(--accent);
        font-weight: 700;
      }
      .header-title {
        flex: 1;
        min-width: 240px;
      }
      header h1 {
        margin: 0 0 4px 0;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      header p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }
      .container {
        padding: 28px 28px 72px 28px;
        max-width: 1320px;
        margin: 0 auto;
      }
      nav {
        margin-top: 16px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      nav a {
        color: var(--muted);
        text-decoration: none;
        padding: 6px 12px;
        border: 1px solid var(--border);
        background: transparent;
        font-size: 12px;
        transition: border-color 0.15s, color 0.15s;
      }
      nav a:hover {
        border-color: var(--border-strong);
        color: var(--text);
      }
      nav a.active {
        border-color: var(--accent);
        color: var(--accent);
        background: transparent;
      }
      .nav-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 999px;
        background: var(--danger);
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        margin-left: 6px;
        line-height: 1;
        animation: pulse-badge 2s ease-in-out infinite;
      }
      @keyframes pulse-badge {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
      }
      .theme-toggle {
        background: transparent;
        border: 1px solid var(--border);
        padding: 6px;
        cursor: pointer;
        color: var(--muted);
        display: flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        transition: border-color 0.15s, color 0.15s;
      }
      .theme-toggle:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .theme-toggle svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 16px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
      }
      .card h3 {
        margin: 0;
        font-size: 13px;
        text-transform: uppercase;
        color: var(--muted);
        letter-spacing: 0.08em;
      }
      .card .value {
        font-size: 26px;
        margin-top: 8px;
        font-weight: 600;
      }
      .search-bar {
        display: flex;
        gap: 12px;
        margin: 20px 0 10px 0;
        flex-wrap: wrap;
      }
      .search-bar input[type="text"] {
        flex: 1;
        min-width: 240px;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--panel-alt);
        color: var(--text);
        transition: border-color 0.2s, box-shadow 0.2s;
        outline: none;
      }
      .search-bar input[type="text"]:focus {
        border-color: var(--accent);
      }
      .search-bar input[type="number"] {
        width: 90px;
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--panel-alt);
        color: var(--text);
        margin-top: 6px;
      }
      .search-bar select {
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--panel-alt);
        color: var(--text);
        margin-top: 6px;
      }
      .search-bar label {
        display: flex;
        flex-direction: column;
        gap: 2px;
        font-size: 12px;
        color: var(--muted);
      }
      .search-meta {
        margin: 8px 0 16px 0;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
      }
      .search-panels {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 16px;
        margin-bottom: 16px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
      }
      .panel h3 {
        margin: 0 0 10px 0;
        font-size: 14px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .panel ul {
        list-style: none;
        padding: 0;
        margin: 0 0 10px 0;
      }
      .panel li {
        margin: 6px 0;
      }
      .panel a {
        color: var(--text);
        text-decoration: none;
      }
      .panel a:hover {
        color: var(--accent);
      }
      .save-form {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .save-form input[type="text"] {
        flex: 1;
        min-width: 160px;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--panel-alt);
        color: var(--text);
      }
      .save-form button {
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #06161a;
        font-weight: 600;
        cursor: pointer;
      }
      .facet-group {
        margin-bottom: 10px;
      }
      .facet-title {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .facet-row {
        font-size: 13px;
        margin: 4px 0;
      }
      .filter-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 8px 0 18px 0;
      }
      .filter-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 999px;
        background: var(--panel-alt);
        color: var(--text);
        text-decoration: none;
        border: 1px solid var(--border);
        font-size: 12px;
      }
      .filter-pill:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .search-bar button {
        padding: 10px 16px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #06161a;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
      }
      .search-bar a {
        padding: 10px 16px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        text-decoration: none;
        font-weight: 600;
      }
      .search-bar a:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .table-wrap {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        border: 1px solid var(--border);
        background: var(--panel);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 0;
        font-size: 13px;
      }
      th, td {
        text-align: left;
        padding: 12px 10px;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
        white-space: nowrap;
        max-width: 300px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: var(--panel-alt);
        color: var(--muted);
        font-weight: 500;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      tbody tr {
        transition: background 0.1s;
      }
      tbody tr:hover {
        background: rgba(0, 255, 159, 0.04);
      }
      table td a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 500;
      }
      table td a:hover {
        text-decoration: underline;
      }
      .section {
        margin-top: 26px;
        padding: 18px 18px 16px 18px;
        border: 1px solid var(--border);
        background: var(--panel);
      }
      .section > h2 {
        margin: 0 0 14px 0;
        font-size: 15px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--muted);
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border);
      }
      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 6px;
      }
      .export-bar {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .export-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 5px 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--muted);
        text-decoration: none;
        font-size: 12px;
        font-weight: 500;
        transition: border-color 0.2s, color 0.2s, background 0.2s;
      }
      .export-btn svg {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
      }
      .export-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
        background: var(--panel-alt);
      }
      .pill {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--panel-alt);
        color: var(--accent-2);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .bar {
        height: 4px;
        background: var(--panel-alt);
        overflow: hidden;
        width: 100%;
      }
      .bar-fill {
        height: 100%;
        background: var(--accent);
      }
      .empty {
        color: var(--muted);
        padding: 10px 0;
      }
      /* Sortable table headers */
      th[data-sort] {
        cursor: pointer;
        user-select: none;
        position: relative;
        padding-right: 18px;
      }
      th[data-sort]:hover {
        color: var(--accent);
      }
      th[data-sort]::after {
        content: "";
        position: absolute;
        right: 4px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 10px;
        opacity: 0.4;
      }
      th[data-sort].sort-asc::after { content: "\25B2"; opacity: 1; }
      th[data-sort].sort-desc::after { content: "\25BC"; opacity: 1; }
      /* Loading spinner */
      .search-loading {
        display: none;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 24px 0;
        color: var(--muted);
        font-size: 14px;
      }
      .search-loading.active { display: flex; }
      .spinner {
        width: 20px;
        height: 20px;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .muted {
        color: var(--muted);
      }
      .code {
        font-family: "JetBrains Mono", "Fira Code", monospace;
      }
      .hero-search {
        text-align: center;
        padding: 34px 26px 28px 26px;
        border: 1px solid var(--border-strong);
        background: var(--panel);
      }
      .hero-kicker {
        margin: 0 0 10px 0;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        color: var(--accent);
        font-weight: 700;
      }
      .hero-heading {
        font-size: 32px;
        font-weight: 700;
        margin: 0 0 8px 0;
      }
      .hero-sub {
        color: var(--muted);
        font-size: 14px;
        margin: 0 0 24px 0;
      }
      .hero-form {
        display: flex;
        max-width: 640px;
        margin: 0 auto;
        gap: 0;
      }
      .hero-form input[type="text"] {
        flex: 1;
        padding: 14px 18px;
        font-size: 16px;
        border: 1px solid var(--border);
        border-right: none;
        background: var(--bg);
        color: var(--text);
        outline: none;
        font-family: inherit;
      }
      .hero-form input[type="text"]:focus {
        border-color: var(--accent);
      }
      .hero-form button {
        padding: 14px 24px;
        font-size: 15px;
        font-weight: 600;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #06161a;
        cursor: pointer;
        font-family: inherit;
      }
      .hero-hints {
        margin-top: 14px;
        font-size: 13px;
        color: var(--muted);
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
        align-items: center;
      }
      .hero-hints a {
        color: var(--accent-2);
        text-decoration: none;
        padding: 3px 8px;
        border-radius: 6px;
        background: var(--panel);
        border: 1px solid var(--border);
        font-size: 12px;
      }
      .hero-hints a:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .stats-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 12px;
        padding: 18px 0 6px 0;
      }
      .stat-chip {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        padding: 14px 16px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-left: 2px solid var(--accent);
        min-width: 110px;
        transition: border-color 0.15s;
      }
      .stat-chip:hover {
        border-left-color: var(--accent-2);
      }
      .stat-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
      }
      .stat-value {
        font-size: 24px;
        font-weight: 700;
        margin-top: 8px;
        font-family: "JetBrains Mono", "Fira Code", monospace;
      }
      .page-intro {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }
      .page-intro-copy h2 {
        margin: 0 0 6px 0;
        font-size: 24px;
      }
      .page-intro-copy p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }
      .mini-note {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--muted);
        font-size: 12px;
      }
      .advanced-toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--muted);
        font-size: 13px;
        cursor: pointer;
        padding: 6px 12px;
        transition: border-color 0.2s, color 0.2s, background 0.2s;
      }
      .advanced-toggle svg {
        width: 14px;
        height: 14px;
      }
      .advanced-toggle:hover {
        color: var(--accent);
        border-color: var(--accent);
        background: var(--panel-alt);
      }
      .adv-panel {
        display: none;
        flex-direction: column;
        gap: 20px;
        margin-top: 12px;
        padding: 20px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
      }
      .adv-panel.open {
        display: flex;
      }
      .adv-section-title {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted);
        margin-bottom: 10px;
      }
      .adv-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 10px;
      }
      .adv-field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .adv-label {
        font-size: 12px;
        color: var(--muted);
      }
      .adv-field input[type="number"] {
        width: 100%;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--panel-alt);
        color: var(--text);
        font-size: 14px;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .adv-field input[type="number"]:focus {
        outline: none;
        border-color: var(--accent);
      }
      .adv-toggles {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .adv-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 14px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--panel-alt);
        color: var(--muted);
        font-size: 13px;
        cursor: pointer;
        transition: border-color 0.2s, color 0.2s, background 0.2s;
        user-select: none;
      }
      .adv-chip input[type="checkbox"] {
        display: none;
      }
      .adv-chip svg {
        width: 14px;
        height: 14px;
        opacity: 0.6;
        transition: opacity 0.2s;
      }
      .adv-chip:hover {
        border-color: var(--accent);
        color: var(--text);
      }
      .adv-chip.active {
        border-color: var(--accent);
        background: transparent;
        color: var(--accent);
      }
      .adv-chip.active svg {
        opacity: 1;
      }
      .adv-actions {
        display: flex;
        gap: 10px;
        align-items: center;
        padding-top: 4px;
        border-top: 1px solid var(--border);
      }
      .adv-apply {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 18px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #06161a;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        transition: background 0.15s;
      }
      .adv-apply svg {
        width: 14px;
        height: 14px;
      }
      .adv-apply:hover {
        background: #00cc80;
      }
      .adv-reset {
        padding: 10px 16px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--muted);
        font-size: 14px;
        cursor: pointer;
        transition: border-color 0.2s, color 0.2s;
      }
      .adv-reset:hover {
        border-color: var(--muted);
        color: var(--text);
      }
      /* Credential cards */
      .cred-table td a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 500;
      }
      .cred-table td a:hover {
        text-decoration: underline;
      }
      .cred-cell {
        white-space: nowrap;
      }
      .cred-cell .code {
        vertical-align: middle;
      }
      .cred-cell .cred-copy-sm {
        vertical-align: middle;
        margin-left: 4px;
      }
      .cred-copy-sm {
        background: none;
        border: 1px solid var(--border);
        border-radius: 4px;
        color: var(--muted);
        cursor: pointer;
        padding: 2px 4px;
        line-height: 1;
        flex-shrink: 0;
        opacity: 0;
        transition: opacity 0.15s, border-color 0.15s, color 0.15s;
      }
      tr:hover .cred-copy-sm {
        opacity: 1;
      }
      .cred-copy-sm:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .cred-copy-sm svg {
        width: 12px;
        height: 12px;
        display: block;
      }
      .stealer-badge {
        display: inline-block;
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--panel-alt);
        color: var(--accent-2);
        letter-spacing: 0.04em;
        white-space: nowrap;
      }
      @media (max-width: 720px) {
        header { position: static; }
        .container { padding: 18px 18px 40px 18px; }
        th, td { font-size: 12px; }
        .hero-search { padding: 28px 0 20px 0; }
        .hero-heading { font-size: 22px; }
        .hero-form input[type="text"] { font-size: 14px; padding: 12px 14px; }
      }
      .pw-pagination {
        display: flex;
        gap: 6px;
        justify-content: center;
        margin-top: 20px;
        flex-wrap: wrap;
      }
      .pw-page-btn {
        padding: 6px 12px;
        border-radius: 7px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        font-size: 13px;
        cursor: pointer;
        text-decoration: none;
        transition: border-color 0.15s;
      }
      .pw-page-btn:hover, .pw-page-btn.active {
        border-color: var(--accent);
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-row">
        <div class="header-title">
          <div class="brand-mark">
            <span class="brand-badge"></span>
            <span class="brand-label">Operator Console</span>
          </div>
          <h1>Telecrime Dashboard</h1>
          <p>Local telemetry, extraction, and credential visibility</p>
        </div>
        <button id="themeToggle" class="theme-toggle" title="Toggle theme">
          <svg id="iconDark" viewBox="0 0 24 24" style="display:none"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
          <svg id="iconLight" viewBox="0 0 24 24" style="display:none"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
          <svg id="iconSystem" viewBox="0 0 24 24" style="display:none"><path d="M20 3H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h3l-1 1v2h12v-2l-1-1h3c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 13H4V5h16v11z"/></svg>
        </button>
      </div>
      <nav>
        <a href="/">Home</a>
        <a href="/search">Search</a>
        <a href="/watchlist" id="navWatchlist">Watchlist<span id="watchlistBadge" class="nav-badge" style="display:none"></span></a>
        <a href="/scheduler">Pipeline</a>
        <a href="/passwords">Passwords</a>
        <a href="/conversations">Conversations</a>
        <a href="/channels">Channels</a>
        <a href="/triage">Triage</a>
        <a href="/stats">Stats</a>
      </nav>
    </header>
    <main class="container">
      {% block content %}{% endblock %}
    </main>
    <script>
      /* --- Clipboard helper: works on HTTP (LAN) and HTTPS --- */
      window.copyToClipboard = function(text) {
        if (navigator.clipboard && window.isSecureContext) {
          return navigator.clipboard.writeText(text);
        }
        var el = document.createElement('textarea');
        el.value = text;
        el.style.cssText = 'position:absolute;left:-9999px;top:-9999px';
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
        return Promise.resolve();
      };

      /* --- Chart.js shared theme helper --- */
      (function() {
        const cs = () => getComputedStyle(document.documentElement);
        window.tcChartColors = () => ({
          accent: cs().getPropertyValue('--accent').trim(),
          accent2: cs().getPropertyValue('--accent-2').trim(),
          danger: cs().getPropertyValue('--danger').trim(),
          muted: cs().getPropertyValue('--muted').trim(),
          text: cs().getPropertyValue('--text').trim(),
          border: cs().getPropertyValue('--border').trim(),
          panel: cs().getPropertyValue('--panel').trim(),
        });
        window.tcChartDefaults = () => {
          const c = tcChartColors();
          return {
            color: c.muted,
            borderColor: c.border,
            plugins: { legend: { labels: { color: c.muted } } },
            scales: {
              x: { ticks: { color: c.muted }, grid: { color: c.border } },
              y: { ticks: { color: c.muted }, grid: { color: c.border } },
            },
          };
        };
      })();

      /* --- Active nav link --- */
      (function() {
        var path = location.pathname;
        document.querySelectorAll('nav a').forEach(function(a) {
          var href = a.getAttribute('href');
          if (href === '/' ? path === '/' : path === href || path.startsWith(href + '/')) {
            a.classList.add('active');
          }
        });
      })();

      /* --- Sortable tables --- */
      (function() {
        function sortTable(table, colIdx, dir) {
          const tbody = table.querySelector('tbody');
          if (!tbody) return;
          const rows = Array.from(tbody.rows);
          rows.sort((a, b) => {
            let av = (a.cells[colIdx] || {}).textContent || '';
            let bv = (b.cells[colIdx] || {}).textContent || '';
            av = av.trim(); bv = bv.trim();
            const an = parseFloat(av.replace(/[,%]/g, '')), bn = parseFloat(bv.replace(/[,%]/g, ''));
            if (!isNaN(an) && !isNaN(bn)) return dir === 'asc' ? an - bn : bn - an;
            return dir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
          });
          rows.forEach(r => tbody.appendChild(r));
        }
        document.addEventListener('click', function(e) {
          const th = e.target.closest('th[data-sort]');
          if (!th) return;
          const table = th.closest('table');
          const idx = Array.from(th.parentElement.children).indexOf(th);
          const wasAsc = th.classList.contains('sort-asc');
          table.querySelectorAll('th[data-sort]').forEach(h => h.classList.remove('sort-asc','sort-desc'));
          const dir = wasAsc ? 'desc' : 'asc';
          th.classList.add('sort-' + dir);
          sortTable(table, idx, dir);
        });
        // Auto-add data-sort to tables with data-sortable
        document.querySelectorAll('table[data-sortable] th').forEach(th => {
          if (!th.hasAttribute('data-sort')) th.setAttribute('data-sort', '');
        });
      })();

      /* --- Keyboard shortcuts --- */
      document.addEventListener('keydown', function(e) {
        if (e.key === '/' && !e.ctrlKey && !e.metaKey) {
          const active = document.activeElement;
          if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT')) return;
          const input = document.querySelector('input[name="q"]');
          if (input) { e.preventDefault(); input.focus(); input.select(); }
        }
        if (e.key === 'Escape') {
          if (document.activeElement) document.activeElement.blur();
        }
      });

      /* --- Watchlist nav badge --- */
      (function() {
        function updateBadge() {
          fetch('/api/watchlist/badge')
            .then(function(r) { return r.json(); })
            .then(function(d) {
              var badge = document.getElementById('watchlistBadge');
              if (!badge) return;
              if (d.new_count > 0) {
                badge.textContent = d.new_count;
                badge.style.display = 'inline-flex';
              } else {
                badge.style.display = 'none';
              }
            })
            .catch(function() {});
        }
        updateBadge();
        setInterval(updateBadge, 30000);
      })();

      /* --- Theme toggle --- */
      (function () {
        const root = document.documentElement;
        const btn = document.getElementById("themeToggle");
        const icons = { dark: document.getElementById("iconDark"), light: document.getElementById("iconLight"), system: document.getElementById("iconSystem") };
        const cycle = ["dark", "light", "system"];
        let current = localStorage.getItem("telecrime-theme") || "system";
        const mq = window.matchMedia("(prefers-color-scheme: light)");

        function resolve(theme) {
          return theme === "system" ? (mq.matches ? "light" : "dark") : theme;
        }

        function apply(theme) {
          const resolved = resolve(theme);
          if (resolved === "light") {
            root.setAttribute("data-theme", "light");
          } else {
            root.removeAttribute("data-theme");
          }
          Object.keys(icons).forEach(k => icons[k].style.display = k === theme ? "block" : "none");
          btn.title = theme === "system" ? "Theme: System" : theme === "dark" ? "Theme: Dark" : "Theme: Light";
        }

        apply(current);

        btn.addEventListener("click", () => {
          current = cycle[(cycle.indexOf(current) + 1) % cycle.length];
          localStorage.setItem("telecrime-theme", current);
          apply(current);
        });

        mq.addEventListener("change", () => {
          if (current === "system") apply(current);
        });
      })();
    </script>
  </body>
</html>
