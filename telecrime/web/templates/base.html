<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title or "Telecrime Console" }}</title>
    <script src="/static/chart.min.js"></script>
    <script src="/static/htmx.min.js"></script>
    <script src="/static/alpine.min.js" defer></script>
    <style>
      /* ============================================================
         Signal Console — design system
         Warm instrument look: serif headlines, mono data, amber
         signal accents, no neon, no drop shadows.
         ============================================================ */
      :root {
        --bg:            #14110d;
        --bg-2:          #1b1712;
        --panel:         #1e1913;
        --panel-2:       #262019;
        --line:          #3a3227;
        --line-strong:   #4d4334;
        --ink:           #e9e2d5;
        --ink-dim:       #a99d8a;
        --ink-faint:     #6f6555;
        --signal:        #e0a020;   /* amber: live/active */
        --signal-dim:    #8a6a1e;
        --ok:            #8fb573;
        --warn:          #c99a3a;
        --bad:           #c05f57;
        --mono:          "SFMono-Regular", "Cascadia Mono", Consolas, "Liberation Mono", monospace;
        --sans:          -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --serif:         Georgia, "Times New Roman", "Iowan Old Style", serif;
        --rail-w:        46px;
      }
      [data-theme="light"] {
        --bg:            #efe9dd;
        --bg-2:          #e6dfd0;
        --panel:         #f7f2e7;
        --panel-2:       #ece4d3;
        --line:          #c9bea8;
        --line-strong:   #a89a7e;
        --ink:           #262117;
        --ink-dim:       #5c5240;
        --ink-faint:     #8a7d66;
        --signal:        #9a6c00;
        --signal-dim:    #c9a24a;
        --ok:            #4c7a33;
        --warn:          #8a6414;
        --bad:           #a33b33;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: var(--sans);
        background: var(--bg);
        color: var(--ink);
        font-size: 14px;
        line-height: 1.5;
        min-height: 100vh;
      }
      a { color: var(--signal); text-decoration: none; }
      a:hover { text-decoration: underline; }
      code, .code { font-family: var(--mono); font-size: .9em; }
      ::selection { background: var(--signal-dim); color: var(--ink); }

      /* ── Layout: instrument rail + content ─────────────────── */
      .layout { display: flex; min-height: 100vh; }
      .rail {
        width: var(--rail-w);
        flex-shrink: 0;
        background: var(--bg-2);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 14px 0;
        gap: 4px;
        position: sticky;
        top: 0;
        height: 100vh;
      }
      .rail-brand {
        width: 28px; height: 28px;
        border: 1px solid var(--signal);
        color: var(--signal);
        display: flex; align-items: center; justify-content: center;
        font-family: var(--serif);
        font-weight: 700;
        font-size: 15px;
        margin-bottom: 14px;
      }
      .rail-link {
        width: 34px; height: 34px;
        display: flex; align-items: center; justify-content: center;
        color: var(--ink-faint);
        border-radius: 3px;
        transition: color .12s, background .12s;
        position: relative;
      }
      .rail-link:hover { color: var(--ink); background: var(--panel-2); text-decoration: none; }
      .rail-link.active { color: var(--signal); }
      .rail-link.active::before {
        content: "";
        position: absolute; left: -5px; top: 50%;
        width: 3px; height: 16px; margin-top: -8px;
        background: var(--signal);
      }
      .rail-link svg { width: 17px; height: 17px; }
      .rail-link .nav-badge {
        position: absolute; top: 2px; right: 2px;
        min-width: 14px; height: 14px; padding: 0 3px;
        border-radius: 999px;
        background: var(--bad); color: #fff;
        font-size: 9px; font-weight: 700;
        display: flex; align-items: center; justify-content: center;
        animation: pulse 2s ease-in-out infinite;
      }
      .rail-spacer { flex: 1; }
      @keyframes pulse { 0%,100% {opacity:1} 50% {opacity:.6} }

      .main { flex: 1; min-width: 0; padding: 0 34px 90px 34px; }

      /* ── Top bar: page identity ─────────────────────────────── */
      .topbar {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        padding: 26px 0 16px 0;
        border-bottom: 1px solid var(--line);
        margin-bottom: 24px;
      }
      .topbar h1 {
        margin: 0;
        font-family: var(--serif);
        font-weight: 400;
        font-size: 27px;
        letter-spacing: .01em;
      }
      .topbar .kicker {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: .22em;
        color: var(--ink-faint);
        margin-bottom: 3px;
      }
      .topbar-note {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--ink-faint);
        white-space: nowrap;
      }
      .topbar-note .live {
        color: var(--signal);
      }

      /* ── Signal lamp ────────────────────────────────────────── */
      .lamp {
        display: inline-block;
        width: 8px; height: 8px;
        border-radius: 50%;
        background: var(--ink-faint);
        vertical-align: middle;
      }
      .lamp.on {
        background: var(--signal);
        box-shadow: 0 0 6px var(--signal);
      }
      .lamp.ok { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
      .lamp.bad { background: var(--bad); box-shadow: 0 0 6px var(--bad); }

      /* ── Metrics line: instrument readouts ──────────────────── */
      .readouts {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 0;
        border: 1px solid var(--line);
        background: var(--panel);
        margin-bottom: 22px;
      }
      .readout {
        padding: 13px 16px;
        border-right: 1px solid var(--line);
        min-width: 0;
      }
      .readout:last-child { border-right: none; }
      .readout .ro-label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: .16em;
        color: var(--ink-faint);
        display: flex; align-items: center; gap: 7px;
      }
      .readout .ro-value {
        font-family: var(--mono);
        font-size: 22px;
        font-weight: 600;
        margin-top: 5px;
        letter-spacing: -.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .readout .ro-value.signal { color: var(--signal); }
      .readout .ro-value.ok { color: var(--ok); }
      .readout .ro-value.bad { color: var(--bad); }
      .readout .ro-sub {
        font-size: 11px;
        color: var(--ink-faint);
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ── Panels (flat, line-divided — no shadows) ───────────── */
      .panel, .card, .section {
        background: var(--panel);
        border: 1px solid var(--line);
        margin-bottom: 20px;
      }
      .card { padding: 16px; }
      .panel { padding: 14px; }
      .section { padding: 18px; margin-top: 24px; }
      .panel > h3, .card > h3, .section > h2, .section-head h3 {
        margin: 0 0 12px 0;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: .18em;
        color: var(--ink-faint);
      }
      .section-head {
        display: flex; align-items: center; justify-content: space-between;
        gap: 12px; flex-wrap: wrap; margin-bottom: 12px;
      }
      .section-head h3 { margin: 0; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; }
      .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
      .search-panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 16px; }
      .ops-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 20px; align-items: start; }
      .stack { display: flex; flex-direction: column; gap: 20px; min-width: 0; }

      /* ── Tables ─────────────────────────────────────────────── */
      .table-wrap {
        overflow-x: auto;
        border: 1px solid var(--line);
        background: var(--panel);
      }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td {
        text-align: left;
        padding: 9px 12px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
      }
      tbody tr:last-child td { border-bottom: none; }
      th {
        background: var(--panel-2);
        color: var(--ink-faint);
        font-weight: 600;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: .12em;
        white-space: nowrap;
      }
      td { color: var(--ink); }
      tbody tr { transition: background .1s; }
      tbody tr:hover { background: var(--panel-2); }
      td a { color: var(--signal); font-weight: 500; }
      th[data-sort] { cursor: pointer; user-select: none; }
      th[data-sort]:hover { color: var(--ink); }
      th[data-sort]::after { content: ""; margin-left: 4px; opacity: .5; }
      th[data-sort].sort-asc::after { content: "▲"; opacity: 1; }
      th[data-sort].sort-desc::after { content: "▼"; opacity: 1; }

      /* ── Tags (field markers, not pills) ────────────────────── */
      .tag, .pill, .stealer-badge {
        display: inline-flex;
        align-items: center;
        font-family: var(--mono);
        font-size: 10px;
        padding: 1px 7px;
        border: 1px solid var(--line-strong);
        color: var(--ink-dim);
        text-transform: uppercase;
        letter-spacing: .08em;
        white-space: nowrap;
      }
      .tag.signal { border-color: var(--signal-dim); color: var(--signal); }
      .tag.ok { border-color: #6b8f55; color: var(--ok); }
      .tag.bad { border-color: #a04c45; color: var(--bad); }
      .filter-pill {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 4px 10px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink-dim);
        font-size: 12px;
        text-decoration: none;
      }
      .filter-pill:hover { border-color: var(--signal); color: var(--signal); text-decoration: none; }
      .filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 16px 0; }

      /* ── Buttons / inputs ───────────────────────────────────── */
      button, .btn {
        font-family: var(--sans);
        font-size: 13px;
        padding: 7px 13px;
        border-radius: 2px;
        border: 1px solid var(--line-strong);
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
        transition: border-color .12s, color .12s;
      }
      button:hover { border-color: var(--signal); color: var(--signal); }
      .btn-primary, .search-bar button, .hero-form button, .adv-apply {
        background: var(--signal);
        border-color: var(--signal);
        color: var(--bg);
        font-weight: 600;
      }
      .btn-primary:hover, .search-bar button:hover, .hero-form button:hover { background: var(--signal); color: var(--bg); }
      input[type="text"], input[type="search"], input[type="number"], select {
        padding: 7px 11px;
        border-radius: 2px;
        border: 1px solid var(--line);
        background: var(--bg-2);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 13px;
        outline: none;
        transition: border-color .12s;
      }
      input:focus, select:focus { border-color: var(--signal); }
      label { font-size: 12px; color: var(--ink-faint); }

      /* ── Search ─────────────────────────────────────────────── */
      .search-bar { display: flex; gap: 10px; margin: 0 0 14px 0; flex-wrap: wrap; align-items: flex-end; }
      .search-bar input[type="text"] { flex: 1; min-width: 240px; }
      .search-bar label { display: flex; flex-direction: column; gap: 4px; }
      .search-meta { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 0 0 16px 0; }
      .search-bar a {
        display: inline-flex; align-items: center;
        padding: 8px 13px;
        border: 1px solid var(--line); border-radius: 2px;
        color: var(--ink-dim); text-decoration: none; font-weight: 500;
      }
      .search-bar a:hover { border-color: var(--signal); color: var(--signal); text-decoration: none; }
      .advanced-toggle {
        display: inline-flex; align-items: center; gap: 6px;
        background: var(--panel); border: 1px solid var(--line); border-radius: 2px;
        color: var(--ink-faint); font-size: 13px; cursor: pointer; padding: 7px 12px;
      }
      .advanced-toggle:hover { color: var(--signal); border-color: var(--signal); }
      .advanced-toggle svg { width: 14px; height: 14px; }
      .adv-panel {
        display: none; flex-direction: column; gap: 18px;
        margin: 12px 0; padding: 18px;
        background: var(--panel); border: 1px solid var(--line);
      }
      .adv-panel.open { display: flex; }
      .adv-section-title { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .14em; color: var(--ink-faint); margin-bottom: 10px; }
      .adv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
      .adv-field { display: flex; flex-direction: column; gap: 4px; }
      .adv-field input[type="number"] { width: 100%; }
      .adv-toggles { display: flex; gap: 10px; flex-wrap: wrap; }
      .adv-chip {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 6px 11px; border: 1px solid var(--line);
        background: var(--panel-2); color: var(--ink-faint); font-size: 13px; cursor: pointer; user-select: none;
      }
      .adv-chip input[type="checkbox"] { display: none; }
      .adv-chip svg { width: 14px; height: 14px; opacity: .6; }
      .adv-chip.active { border-color: var(--signal); color: var(--signal); }
      .adv-chip.active svg { opacity: 1; }
      .adv-actions { display: flex; gap: 10px; align-items: center; padding-top: 4px; border-top: 1px solid var(--line); }
      .adv-reset { background: transparent; }
      .save-form { display: flex; gap: 8px; flex-wrap: wrap; }
      .save-form input[type="text"] { flex: 1; min-width: 160px; }

      /* ── Misc ───────────────────────────────────────────────── */
      .bar { height: 4px; background: var(--panel-2); overflow: hidden; min-width: 60px; }
      .bar-fill { height: 100%; background: var(--signal); }
      .empty { color: var(--ink-faint); padding: 14px 0; font-size: 13px; }
      .muted { color: var(--ink-faint); }
      .spinner {
        width: 14px; height: 14px;
        border: 2px solid var(--line-strong);
        border-top-color: var(--signal);
        border-radius: 50%;
        animation: spin .6s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .search-loading { display: none; align-items: center; justify-content: center; gap: 10px; padding: 24px 0; color: var(--ink-faint); }
      .search-loading.active { display: flex; }
      .mini-note {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 4px 10px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink-faint);
        font-size: 11px;
        font-family: var(--mono);
      }
      .export-bar { display: flex; gap: 6px; flex-wrap: wrap; }
      .export-btn {
        display: inline-flex; align-items: center; gap: 5px;
        padding: 4px 9px; border: 1px solid var(--line);
        background: var(--panel); color: var(--ink-faint);
        font-size: 11px; font-weight: 500; text-decoration: none;
      }
      .export-btn:hover { border-color: var(--signal); color: var(--signal); text-decoration: none; }
      .export-btn svg { width: 13px; height: 13px; }

      .pw-pagination { display: flex; gap: 6px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
      .pw-page-btn {
        padding: 5px 11px; border: 1px solid var(--line);
        background: var(--panel); color: var(--ink-dim);
        font-size: 13px; text-decoration: none;
      }
      .pw-page-btn:hover, .pw-page-btn.active { border-color: var(--signal); color: var(--signal); text-decoration: none; }

      .watchlist-alert-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
      .watchlist-alert-card {
        display: flex; flex-direction: column; gap: 3px;
        padding: 11px 13px;
        border: 1px solid #a04c45;
        background: var(--panel);
        text-decoration: none; color: var(--ink);
      }
      .watchlist-alert-card:hover { border-color: var(--bad); background: var(--panel-2); text-decoration: none; }
      .watchlist-alert-count { font-size: 19px; font-weight: 700; color: var(--bad); font-family: var(--mono); }
      .watchlist-alert-label { font-size: 13px; font-weight: 600; }
      .watchlist-alert-query { font-size: 11px; color: var(--ink-faint); font-family: var(--mono); }

      .cred-copy-sm {
        background: none; border: 1px solid var(--line);
        color: var(--ink-faint); cursor: pointer; padding: 2px 4px; line-height: 1;
        opacity: 0; transition: opacity .15s;
      }
      tr:hover .cred-copy-sm { opacity: 1; }
      .cred-copy-sm:hover { border-color: var(--signal); color: var(--signal); }
      .cred-copy-sm svg { width: 12px; height: 12px; display: block; }

      /* ── Hero (empty search) ────────────────────────────────── */
      .hero-search {
        text-align: center;
        padding: 52px 28px 40px 28px;
        border: 1px solid var(--line-strong);
        background: var(--panel);
      }
      .hero-kicker { margin: 0 0 10px 0; font-size: 10px; text-transform: uppercase; letter-spacing: .28em; color: var(--signal); font-weight: 700; }
      .hero-heading { font-family: var(--serif); font-size: 30px; font-weight: 400; margin: 0 0 8px 0; }
      .hero-sub { color: var(--ink-faint); font-size: 14px; margin: 0 0 26px 0; }
      .hero-form { display: flex; max-width: 620px; margin: 0 auto; }
      .hero-form input[type="text"] {
        flex: 1; padding: 12px 15px; font-size: 15px;
        border: 1px solid var(--line-strong); border-right: none; border-radius: 0;
        background: var(--bg); color: var(--ink); outline: none; font-family: inherit;
      }
      .hero-form button { border-radius: 0; padding: 12px 22px; }
      .hero-hints { margin-top: 16px; font-size: 13px; color: var(--ink-faint); display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      .hero-hints a {
        color: var(--ink-dim); text-decoration: none; padding: 2px 9px;
        border: 1px solid var(--line); background: var(--panel-2); font-size: 11px; font-family: var(--mono);
      }
      .hero-hints a:hover { border-color: var(--signal); color: var(--signal); }

      /* ── Banners ────────────────────────────────────────────── */
      .alert-banner {
        margin: 0 0 16px 0; padding: 10px 13px;
        border: 1px solid var(--warn);
        background: color-mix(in srgb, var(--warn) 8%, transparent);
        color: var(--warn);
        font-size: 13px; line-height: 1.45;
      }
      .flash {
        padding: 10px 13px; margin-bottom: 16px; font-size: 13px;
        border: 1px solid var(--ok);
        background: color-mix(in srgb, var(--ok) 8%, transparent); color: var(--ok);
      }
      .flash.err { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 8%, transparent); color: var(--bad); }

      /* ── Scheduler cards ────────────────────────────────────── */
      .job-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; margin-top: 20px; }
      .job-card {
        background: var(--panel); border: 1px solid var(--line); padding: 16px;
        display: flex; flex-direction: column; gap: 12px;
      }
      .job-card.running { border-color: var(--signal); }
      .job-card.error { border-color: var(--bad); }
      .job-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .job-name { font-size: 15px; font-weight: 600; font-family: var(--serif); }
      .job-badge {
        display: inline-flex; align-items: center; gap: 5px;
        font-size: 10px; padding: 2px 8px; font-weight: 600; letter-spacing: .08em;
        border: 1px solid var(--line-strong); color: var(--ink-dim); text-transform: uppercase;
      }
      .job-badge.running, .badge-running { border-color: var(--signal-dim); color: var(--signal); }
      .badge-ok { border-color: #6b8f55; color: var(--ok); }
      .badge-error { border-color: #a04c45; color: var(--bad); }
      .badge-disabled { border-color: var(--line); color: var(--ink-faint); }
      .badge-pending { border-color: var(--line-strong); color: var(--ink-dim); }
      .job-desc { font-size: 13px; color: var(--ink-faint); line-height: 1.5; }
      .job-meta { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--ink-faint); }
      .meta-row { display: flex; gap: 8px; }
      .meta-label { min-width: 90px; color: var(--ink-faint); }
      .meta-value { color: var(--ink-dim); font-family: var(--mono); font-size: 11px; word-break: break-all; }
      .meta-value.ok { color: var(--ok); }
      .meta-value.err { color: var(--bad); }
      .trigger-btn {
        margin-top: auto; padding: 7px 13px; border: 1px solid var(--signal);
        background: transparent; color: var(--signal); font-size: 13px; font-weight: 600;
        cursor: pointer; align-self: flex-start;
      }
      .trigger-btn:hover { background: var(--signal); color: var(--bg); }
      .trigger-btn:disabled { opacity: .4; cursor: not-allowed; border-color: var(--line); color: var(--ink-faint); }
      .interval-badge {
        display: inline-block; font-size: 11px; padding: 1px 7px;
        background: var(--panel-2); border: 1px solid var(--line); color: var(--ink-faint);
      }
      .spinner-inline {
        display: inline-block; width: 11px; height: 11px;
        border: 2px solid var(--line-strong); border-top-color: var(--signal); border-radius: 50%;
        animation: spin .6s linear infinite; vertical-align: middle;
      }
      .pipeline-activity {
        background: var(--panel); border: 1px solid var(--signal); padding: 18px 20px; margin-bottom: 20px; display: none;
      }
      .pipeline-activity.visible { display: block; }
      .pipeline-activity-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
      .pipeline-activity-title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; font-family: var(--serif); }
      .pipeline-elapsed { font-size: 12px; color: var(--ink-faint); font-family: var(--mono); }
      .stage-dots { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
      .stage-dot {
        display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 2px 7px;
        border: 1px solid var(--line); color: var(--ink-faint); background: var(--panel-2);
        white-space: nowrap; font-family: var(--mono);
      }
      .stage-dot.done { border-color: #6b8f55; color: var(--ok); }
      .stage-dot.active { border-color: var(--signal); color: var(--signal); font-weight: 600; }
      .stage-dot.failed { border-color: var(--bad); color: var(--bad); }
      .pipeline-stats { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 12px; font-size: 13px; }
      .pipeline-stat { display: flex; flex-direction: column; gap: 2px; }
      .pipeline-stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-faint); }
      .pipeline-stat-value { font-size: 18px; font-weight: 600; font-family: var(--mono); }
      .pipeline-archive { font-size: 12px; color: var(--ink-faint); margin-bottom: 8px; font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .pipeline-dl-bar { height: 3px; background: var(--panel-2); overflow: hidden; margin-bottom: 10px; display: none; }
      .pipeline-dl-bar.active { display: block; }
      .pipeline-dl-fill { height: 100%; background: var(--signal); transition: width .5s; }
      .pipeline-queue-bar { height: 4px; background: var(--panel-2); overflow: hidden; margin-bottom: 6px; display: none; }
      .pipeline-queue-bar.active { display: block; }
      .pipeline-queue-fill { height: 100%; background: var(--ink-faint); transition: width 1s; }
      .pipeline-queue-label { font-size: 11px; color: var(--ink-faint); margin-bottom: 10px; display: none; }
      .pipeline-queue-label.active { display: flex; justify-content: space-between; }
      .pipeline-results { font-size: 12px; color: var(--ink-faint); font-family: var(--mono); display: flex; flex-direction: column; gap: 3px; }
      .pipeline-results span:last-child { color: var(--ink-dim); }

      /* ── Conversation detail ────────────────────────────────── */
      .conv-meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
      .conv-stat { background: var(--panel); border: 1px solid var(--line); padding: 13px 17px; text-align: center; }
      .conv-stat-value { font-size: 25px; font-weight: 600; color: var(--signal); font-family: var(--mono); }
      .conv-stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-faint); margin-top: 4px; }
      .msg-row { border-bottom: 1px solid var(--line); padding: 10px 0; }
      .msg-row:last-child { border-bottom: none; }
      .msg-ts { font-size: 11px; color: var(--ink-faint); white-space: nowrap; font-family: var(--mono); }
      .msg-text { font-size: 13px; margin-top: 4px; white-space: pre-wrap; word-break: break-word; max-height: 80px; overflow: hidden; }
      .msg-fwd { font-size: 11px; color: var(--ink-faint); font-style: italic; }

      /* ── Watchlist page ─────────────────────────────────────── */
      .wl-add-form {
        display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end;
        padding: 15px 17px; border: 1px solid var(--line);
        background: var(--panel); margin-bottom: 18px;
      }
      .wl-field { display: flex; flex-direction: column; gap: 4px; }
      .wl-field label { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-faint); }
      .wl-field.grow { flex: 1; min-width: 160px; }
      .wl-add-btn { background: var(--signal); color: var(--bg); font-weight: 600; border: none; padding: 9px 17px; }
      .wl-new-badge {
        display: inline-flex; align-items: center; justify-content: center;
        min-width: 22px; height: 20px; padding: 0 6px; border-radius: 999px;
        background: var(--bad); color: #fff; font-size: 11px; font-weight: 700;
        animation: pulse 2s ease-in-out infinite;
      }
      .wl-actions { display: flex; gap: 6px; }
      .wl-btn {
        padding: 4px 9px; border: 1px solid var(--line);
        background: transparent; color: var(--ink-faint); font-size: 12px; cursor: pointer; text-decoration: none;
      }
      .wl-btn:hover { border-color: var(--signal); color: var(--signal); }
      .wl-btn.danger:hover { border-color: var(--bad); color: var(--bad); }
      .wl-toggle {
        width: 36px; height: 19px; border: 1px solid var(--line);
        background: var(--panel-2); cursor: pointer; position: relative; flex-shrink: 0;
      }
      .wl-toggle.on { background: color-mix(in srgb, var(--ok) 25%, transparent); border-color: var(--ok); }
      .wl-toggle::after {
        content: ''; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px;
        background: var(--ink-faint); transition: transform .15s, background .15s;
      }
      .wl-toggle.on::after { transform: translateX(17px); background: var(--ok); }
      .match-type-pill {
        display: inline-block; font-size: 10px; padding: 1px 7px;
        background: var(--panel-2); border: 1px solid var(--line); color: var(--ink-faint);
        text-transform: uppercase; letter-spacing: .06em;
      }

      /* ── Legacy aliases ─────────────────────────────────────── */
      .page-intro { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
      .page-intro-copy h2 { margin: 0; font-size: 22px; font-weight: 400; font-family: var(--serif); }
      .page-intro-copy p { margin: 4px 0 0 0; color: var(--ink-faint); font-size: 13px; }
      .page-header { margin-bottom: 16px; }
      .page-header h2 { margin: 0 0 4px 0; font-size: 20px; font-weight: 400; font-family: var(--serif); }
      .page-header p { margin: 0; color: var(--ink-faint); font-size: 13px; }
      .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0; margin: 0 0 20px 0; border: 1px solid var(--line); background: var(--panel); }
      .stat-chip { padding: 13px 16px; border-right: 1px solid var(--line); }
      .stat-chip:last-child { border-right: none; }
      .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: .14em; color: var(--ink-faint); }
      .stat-value { font-size: 21px; font-weight: 600; font-family: var(--mono); margin-top: 4px; }

      /* Mobile */
      @media (max-width: 860px) {
        .layout { flex-direction: column; }
        .rail { display: none; }
        .main { padding: 0 14px 60px 14px; }
        .two-col, .ops-grid { grid-template-columns: 1fr; }
        .topbar { padding-top: 18px; }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <nav class="rail">
        <div class="rail-brand">T</div>
        <a class="nav-link rail-link" href="/" title="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg></a>
        <a class="rail-link" href="/search" title="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg></a>
        <a class="rail-link" href="/watchlist" id="navWatchlist" title="Watchlist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 2l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/></svg><span id="watchlistBadge" class="nav-badge" style="display:none"></span></a>
        <a class="rail-link" href="/scheduler" title="Pipeline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></a>
        <a class="rail-link" href="/triage" title="Triage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l2 2"/></svg></a>
        <div class="rail-spacer"></div>
        <a class="rail-link" href="/stats" title="Analytics"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg></a>
        <a class="rail-link" href="/passwords" title="Passwords"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="11" width="18" height="11"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></a>
        <a class="rail-link" href="/conversations" title="Conversations"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></a>
        <a class="rail-link" href="/channels" title="Channels"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></a>
        <div class="rail-spacer"></div>
        <button id="themeToggle" class="rail-link" title="Toggle theme" style="border:none;background:none;cursor:pointer;">
          <svg id="iconDark" viewBox="0 0 24 24" style="display:none;fill:currentColor"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.4 5.4 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
          <svg id="iconLight" viewBox="0 0 24 24" style="display:none;fill:currentColor"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a1 1 0 0 0-1.41 0l-1.06 1.06a1 1 0 0 0 1.41 1.41l1.06-1.06a1 1 0 0 0 0-1.41zm12.37 12.37a1 1 0 0 0-1.41 0l-1.06 1.06a1 1 0 0 0 1.41 1.41l1.06-1.06a1 1 0 0 0 0-1.41zm1.06-10.96a1 1 0 0 0 0-1.41 1 1 0 0 0-1.41 0l-1.06 1.06a1 1 0 0 0 1.41 1.41l1.06-1.06zM7.05 18.36a1 1 0 0 0 0-1.41 1 1 0 0 0-1.41 0l-1.06 1.06a1 1 0 0 0 1.41 1.41l1.06-1.06z"/></svg>
          <svg id="iconSystem" viewBox="0 0 24 24" style="display:none;fill:currentColor"><path d="M20 3H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h3l-1 1v2h12v-2l-1-1h3c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 13H4V5h16v11z"/></svg>
        </button>
      </nav>

      <main class="main">
        {% block content %}{% endblock %}
      </main>
    </div>

    <script>
      /* --- Clipboard helper --- */
      window.copyToClipboard = function(text) {
        if (navigator.clipboard && window.isSecureContext) {
          return navigator.clipboard.writeText(text);
        }
        var el = document.createElement('textarea');
        el.value = text;
        el.style.cssText = 'position:absolute;left:-9999px;top:-9999px';
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
        return Promise.resolve();
      };

      /* --- Chart.js shared theme helper --- */
      (function() {
        const cs = () => getComputedStyle(document.documentElement);
        window.tcChartColors = () => ({
          accent: cs().getPropertyValue('--signal').trim(),
          accent2: cs().getPropertyValue('--signal-dim').trim(),
          danger: cs().getPropertyValue('--bad').trim(),
          muted: cs().getPropertyValue('--ink-faint').trim(),
          text: cs().getPropertyValue('--ink-dim').trim(),
          border: cs().getPropertyValue('--line').trim(),
          panel: cs().getPropertyValue('--panel').trim(),
        });
        window.tcChartDefaults = () => {
          const c = tcChartColors();
          return {
            color: c.muted,
            borderColor: c.border,
            plugins: { legend: { labels: { color: c.muted } } },
            scales: {
              x: { ticks: { color: c.muted }, grid: { color: c.border } },
              y: { ticks: { color: c.muted }, grid: { color: c.border } },
            },
          };
        };
      })();

      /* --- Active rail link --- */
      (function() {
        var path = location.pathname;
        document.querySelectorAll('.rail-link').forEach(function(a) {
          var href = a.getAttribute('href');
          if (href && (href === '/' ? path === '/' : path === href || path.startsWith(href + '/'))) {
            a.classList.add('active');
          }
        });
      })();

      /* --- Sortable tables --- */
      (function() {
        function sortTable(table, colIdx, dir) {
          const tbody = table.querySelector('tbody');
          if (!tbody) return;
          const rows = Array.from(tbody.rows);
          rows.sort((a, b) => {
            let av = (a.cells[colIdx] || {}).textContent || '';
            let bv = (b.cells[colIdx] || {}).textContent || '';
            av = av.trim(); bv = bv.trim();
            const an = parseFloat(av.replace(/[,%]/g, '')), bn = parseFloat(bv.replace(/[,%]/g, ''));
            if (!isNaN(an) && !isNaN(bn)) return dir === 'asc' ? an - bn : bn - an;
            return dir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
          });
          rows.forEach(r => tbody.appendChild(r));
        }
        document.addEventListener('click', function(e) {
          const th = e.target.closest('th[data-sort]');
          if (!th) return;
          const table = th.closest('table');
          const idx = Array.from(th.parentElement.children).indexOf(th);
          const wasAsc = th.classList.contains('sort-asc');
          table.querySelectorAll('th[data-sort]').forEach(h => h.classList.remove('sort-asc','sort-desc'));
          const dir = wasAsc ? 'desc' : 'asc';
          th.classList.add('sort-' + dir);
          sortTable(table, idx, dir);
        });
        document.querySelectorAll('table[data-sortable] th').forEach(th => {
          if (!th.hasAttribute('data-sort')) th.setAttribute('data-sort', '');
        });
      })();

      /* --- Keyboard shortcuts --- */
      document.addEventListener('keydown', function(e) {
        if (e.key === '/' && !e.ctrlKey && !e.metaKey) {
          const active = document.activeElement;
          if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT')) return;
          const input = document.querySelector('input[name="q"]');
          if (input) { e.preventDefault(); input.focus(); input.select(); }
        }
        if (e.key === 'Escape') {
          if (document.activeElement) document.activeElement.blur();
        }
      });

      /* --- Watchlist nav badge --- */
      (function() {
        function updateBadge() {
          fetch('/api/watchlist/badge')
            .then(function(r) { return r.json(); })
            .then(function(d) {
              var badge = document.getElementById('watchlistBadge');
              if (!badge) return;
              if (d.new_count > 0) {
                badge.textContent = d.new_count;
                badge.style.display = 'flex';
              } else {
                badge.style.display = 'none';
              }
            })
            .catch(function() {});
        }
        updateBadge();
        setInterval(updateBadge, 30000);
      })();

      /* --- Theme toggle --- */
      (function () {
        const root = document.documentElement;
        const btn = document.getElementById("themeToggle");
        const icons = { dark: document.getElementById("iconDark"), light: document.getElementById("iconLight"), system: document.getElementById("iconSystem") };
        const cycle = ["dark", "light", "system"];
        let current = localStorage.getItem("telecrime-theme") || "system";
        const mq = window.matchMedia("(prefers-color-scheme: light)");

        function resolve(theme) {
          return theme === "system" ? (mq.matches ? "light" : "dark") : theme;
        }

        function apply(theme) {
          const resolved = resolve(theme);
          if (resolved === "light") {
            root.setAttribute("data-theme", "light");
          } else {
            root.removeAttribute("data-theme");
          }
          Object.keys(icons).forEach(k => icons[k].style.display = k === theme ? "block" : "none");
          btn.title = theme === "system" ? "Theme: System" : theme === "dark" ? "Theme: Dark" : "Theme: Light";
        }

        apply(current);

        btn.addEventListener("click", () => {
          current = cycle[(cycle.indexOf(current) + 1) % cycle.length];
          localStorage.setItem("telecrime-theme", current);
          apply(current);
        });

        mq.addEventListener("change", () => {
          if (current === "system") apply(current);
        });
      })();
    </script>
  </body>
</html>
