{% extends "base.html" %}
{% block content %}
<style>
  .job-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 16px;
    margin-top: 20px;
  }
  .job-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .job-card.running {
    border-color: var(--accent);
  }
  .job-card.error {
    border-color: var(--danger);
  }
  .job-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .job-name {
    font-size: 16px;
    font-weight: 600;
    text-transform: capitalize;
  }
  .job-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 999px;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .badge-running { background: rgba(79,209,197,0.15); color: var(--accent); }
  .badge-ok { background: rgba(79,209,197,0.1); color: var(--accent); }
  .badge-error { background: rgba(247,118,142,0.15); color: var(--danger); }
  .badge-disabled { background: rgba(138,161,178,0.1); color: var(--muted); }
  .badge-pending { background: rgba(122,162,247,0.1); color: var(--accent-2); }
  .job-desc {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
  }
  .job-meta {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
  }
  .meta-row {
    display: flex;
    gap: 8px;
  }
  .meta-label {
    min-width: 90px;
    color: var(--muted);
  }
  .meta-value {
    color: var(--text);
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    word-break: break-all;
  }
  .meta-value.ok { color: var(--accent); }
  .meta-value.err { color: var(--danger); }
  .trigger-btn {
    margin-top: auto;
    padding: 9px 16px;
    border-radius: 9px;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    align-self: flex-start;
  }
  .trigger-btn:hover {
    background: var(--accent);
    color: #06161a;
  }
  .trigger-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    border-color: var(--border);
    color: var(--muted);
  }
  .page-header {
    margin-bottom: 8px;
  }
  .page-header h2 {
    margin: 0 0 4px 0;
    font-size: 20px;
  }
  .page-header p {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
  }
  .interval-badge {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 6px;
    background: var(--panel-alt);
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .spinner-inline {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: middle;
  }
  .flash {
    padding: 12px 16px;
    border-radius: 10px;
    margin-bottom: 16px;
    font-size: 14px;
    border: 1px solid var(--accent);
    background: rgba(79,209,197,0.08);
    color: var(--accent);
  }
  .flash.err {
    border-color: var(--danger);
    background: rgba(247,118,142,0.08);
    color: var(--danger);
  }
  .pipeline-activity {
    background: var(--panel);
    border: 1px solid var(--accent);
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 20px;
    display: none;
  }
  .pipeline-activity.visible { display: block; }
  .pipeline-activity-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .pipeline-activity-title {
    font-size: 15px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .pipeline-elapsed {
    font-size: 12px;
    color: var(--muted);
    font-family: "JetBrains Mono", monospace;
  }
  .stage-dots {
    display: flex;
    gap: 4px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .stage-dot {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--muted);
    background: var(--panel-alt);
    white-space: nowrap;
  }
  .stage-dot.done { border-color: var(--accent); color: var(--accent); background: rgba(79,209,197,0.08); }
  .stage-dot.active { border-color: var(--accent-2); color: var(--accent-2); background: rgba(122,162,247,0.12); font-weight: 600; }
  .stage-dot.failed { border-color: var(--danger); color: var(--danger); background: rgba(247,118,142,0.08); }
  .pipeline-stats {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 12px;
    font-size: 13px;
  }
  .pipeline-stat { display: flex; flex-direction: column; gap: 2px; }
  .pipeline-stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .pipeline-stat-value { font-size: 18px; font-weight: 600; font-family: "JetBrains Mono", monospace; }
  .pipeline-archive {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
    font-family: "JetBrains Mono", monospace;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pipeline-dl-bar {
    height: 4px;
    background: var(--panel-alt);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 10px;
    display: none;
  }
  .pipeline-dl-bar.active { display: block; }
  .pipeline-dl-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 999px;
    transition: width 0.5s;
  }
  .pipeline-queue-bar {
    height: 6px;
    background: var(--panel-alt);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 6px;
    display: none;
  }
  .pipeline-queue-bar.active { display: block; }
  .pipeline-queue-fill {
    height: 100%;
    background: var(--muted);
    border-radius: 999px;
    transition: width 1s;
  }
  .pipeline-queue-label {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 10px;
    display: none;
  }
  .pipeline-queue-label.active { display: flex; justify-content: space-between; }
  .pipeline-results {
    font-size: 12px;
    color: var(--muted);
    font-family: "JetBrains Mono", monospace;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .pipeline-results span:last-child { color: var(--text); }
</style>

<div class="page-header">
  <h2>Scheduler</h2>
  <p>Background jobs run automatically. Use "Run Now" to trigger manually.</p>
</div>

<div class="pipeline-activity" id="pipelineActivity">
  <div class="pipeline-activity-header">
    <div class="pipeline-activity-title">
      <span class="spinner-inline"></span>
      Pipeline Running
    </div>
    <span class="pipeline-elapsed" id="pipelineElapsed"></span>
  </div>
  <div class="stage-dots" id="stageDots"></div>
  <div class="pipeline-archive" id="pipelineArchive"></div>
  <div class="pipeline-dl-bar" id="dlBar"><div class="pipeline-dl-fill" id="dlFill" style="width:0%"></div></div>
  <div class="pipeline-queue-bar" id="queueBar"><div class="pipeline-queue-fill" id="queueFill" style="width:0%"></div></div>
  <div class="pipeline-queue-label" id="queueLabel"><span id="queueProgress"></span><span id="queueEta"></span></div>
  <div class="pipeline-stats">
    <div class="pipeline-stat">
      <span class="pipeline-stat-label">Credentials</span>
      <span class="pipeline-stat-value" id="statCreds">—</span>
    </div>
    <div class="pipeline-stat">
      <span class="pipeline-stat-label">Duplicates</span>
      <span class="pipeline-stat-value" id="statDups">—</span>
    </div>
    <div class="pipeline-stat">
      <span class="pipeline-stat-label">Messages</span>
      <span class="pipeline-stat-value" id="statMsgs">—</span>
    </div>
    <div class="pipeline-stat">
      <span class="pipeline-stat-label">Errors</span>
      <span class="pipeline-stat-value" id="statErrors">—</span>
    </div>
  </div>
  <div class="pipeline-results" id="pipelineResults"></div>
</div>

{% include "partials/scheduler_jobs.html" %}

<script>
(function() {
  var STAGES = ['ingest','channel_discover','discover','plan','acquire','enrich','extract','parse','finalize'];
  var STAGE_LABELS = {
    ingest:'Ingest', channel_discover:'Channels', discover:'Discover', plan:'Plan',
    acquire:'Acquire', enrich:'Enrich', extract:'Extract', parse:'Parse', finalize:'Finalize'
  };

  function fmt(n) { return (n || 0).toLocaleString(); }
  function fmtElapsed(s) {
    if (!s) return '';
    if (s < 60) return s + 's';
    return Math.floor(s/60) + 'm' + String(s % 60).padStart(2,'0') + 's';
  }

  function renderStages(data) {
    var completed = data.stages_completed || [];
    var failed = data.stages_failed || [];
    var current = data.current_stage;
    var html = '';
    STAGES.forEach(function(s) {
      var cls = 'stage-dot';
      var icon = '○';
      if (failed.indexOf(s) >= 0) { cls += ' failed'; icon = '✗'; }
      else if (completed.indexOf(s) >= 0) { cls += ' done'; icon = '✓'; }
      else if (s === current) { cls += ' active'; icon = '▶'; }
      html += '<span class="' + cls + '">' + icon + ' ' + (STAGE_LABELS[s] || s) + '</span>';
    });
    document.getElementById('stageDots').innerHTML = html;
  }

  function updatePanel(data) {
    var panel = document.getElementById('pipelineActivity');
    if (!data || !data.running) { panel.classList.remove('visible'); return; }
    panel.classList.add('visible');

    document.getElementById('pipelineElapsed').textContent = fmtElapsed(data.elapsed_seconds);
    renderStages(data);

    var arch = '';
    if (data.archive_total > 0) {
      arch = '[' + data.archive_index + '/' + data.archive_total + '] ';
    }
    if (data.current_archive) arch += data.current_archive;
    document.getElementById('pipelineArchive').textContent = arch;

    var dlBar = document.getElementById('dlBar');
    var dlFill = document.getElementById('dlFill');
    if (data.dl_active) {
      dlBar.classList.add('active');
      dlFill.style.width = (data.dl_pct || 0) + '%';
      var spd = data.dl_speed > 0 ? ' · ' + data.dl_speed.toFixed(1) + ' MB/s' : '';
      document.getElementById('pipelineArchive').textContent = arch + ' — ' + Math.round(data.dl_pct || 0) + '%' + spd;
    } else {
      dlBar.classList.remove('active');
    }

    // Archive queue progress bar + ETA
    var queueBar = document.getElementById('queueBar');
    var queueLabel = document.getElementById('queueLabel');
    if (data.archive_total > 0 && data.archive_index > 0) {
      var pct = (data.archive_index / data.archive_total) * 100;
      document.getElementById('queueFill').style.width = pct + '%';
      queueBar.classList.add('active');
      queueLabel.classList.add('active');
      document.getElementById('queueProgress').textContent =
        data.archive_index.toLocaleString() + ' / ' + data.archive_total.toLocaleString() +
        ' archives (' + pct.toFixed(1) + '%)';
      var eta = '';
      if (data.elapsed_seconds > 0 && data.archive_index > 0) {
        var rate = data.archive_index / data.elapsed_seconds; // archives/sec
        var remaining = data.archive_total - data.archive_index;
        var etaSec = Math.round(remaining / rate);
        if (etaSec < 3600) eta = 'ETA ~' + Math.round(etaSec / 60) + 'm';
        else if (etaSec < 86400) eta = 'ETA ~' + (etaSec / 3600).toFixed(1) + 'h';
        else eta = 'ETA ~' + (etaSec / 86400).toFixed(1) + 'd';
      }
      document.getElementById('queueEta').textContent = eta;
    } else {
      queueBar.classList.remove('active');
      queueLabel.classList.remove('active');
    }

    document.getElementById('statCreds').textContent = fmt(data.credentials);
    document.getElementById('statDups').textContent = fmt(data.duplicates);
    document.getElementById('statMsgs').textContent = fmt(data.messages);
    document.getElementById('statErrors').textContent = data.errors || 0;

    var results = data.recent_results || [];
    // Escape before innerHTML: recent_results contains attacker-controlled
    // archive filenames — unescaped, a channel posting '<img onerror=...>.zip'
    // would execute script in every dashboard viewer's session.
    var resultEl = document.getElementById('pipelineResults');
    resultEl.innerHTML = '';
    results.forEach(function(r) {
      var span = document.createElement('span');
      span.textContent = r;
      resultEl.appendChild(span);
    });
  }

  function poll() {
    fetch('/scheduler/pipeline-status')
      .then(function(r) { return r.json(); })
      .then(function(data) { updatePanel(data); })
      .catch(function() {});
  }

  poll();
  setInterval(poll, 3000);
})();
</script>
{% endblock %}
