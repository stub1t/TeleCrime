# Alembic Configuration for Telecrime

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Database URL — set via TELECRIME_DATABASE_URL env var or override here.
# The env/config.toml loader in telecrime/database.py supplies the real URL
# at runtime; this placeholder is only used if you run alembic directly
# without going through `telecrime db-upgrade`.
sqlalchemy.url = postgresql://telecrime:change-me@localhost:5432/telecrime

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
