name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: telecrime
          POSTGRES_PASSWORD: telecrime
          POSTGRES_DB: telecrime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TELECRIME_DATABASE_URL: postgresql://telecrime:telecrime@localhost:5432/telecrime_test
      TELECRIME_TEST_DATABASE_URL: postgresql://telecrime:telecrime@localhost:5432/telecrime_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Install uv
        run: python -m pip install uv

      - name: Install Python dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check telecrime/ tests/ process_folder.py

      - name: Mypy
        run: uv run mypy telecrime/

      - name: Pytest
        # Emit the failing test names as a check-run annotation: the raw job
        # log needs repo-admin auth, so without this a red CI run only says
        # "Process completed with exit code 1" and cannot be diagnosed from
        # the API/annotations alone.
        run: |
          set +e
          uv run pytest tests/ -q 2>&1 | tee /tmp/pytest.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            summary=$(grep -E "^(FAILED|ERROR)" /tmp/pytest.log | head -20 | tr '\n' ';')
            echo "::error title=Pytest failures::${summary:-pytest exited $rc}"
          fi
          exit "$rc"
