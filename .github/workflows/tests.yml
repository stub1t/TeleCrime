name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: telecrime
          POSTGRES_PASSWORD: telecrime
          POSTGRES_DB: telecrime
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TELECRIME_DATABASE_URL: postgresql://telecrime:telecrime@localhost:5432/telecrime
      TELECRIME_TEST_DATABASE_URL: postgresql://telecrime:telecrime@localhost:5432/telecrime
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Install uv
        run: python -m pip install uv

      - name: Install Python dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check telecrime/ tests/ process_folder.py

      - name: Mypy
        run: uv run mypy telecrime/

      - name: Pytest
        run: uv run pytest tests/ -q
