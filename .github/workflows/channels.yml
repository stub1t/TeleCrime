name: Channel lists

on:
  push:
    paths:
      - channels.txt
      - channels.md
  workflow_dispatch:
    # Requires a self-hosted runner on the TeleCrime host (needs DB + Telegram
    # access). Without it, the lists are regenerated by the host cron via
    # scripts/update-channels.sh --push.
    inputs:
      push_lists:
        description: "Regenerate and push channel lists"
        required: false
        default: true

jobs:
  # ── Validate ────────────────────────────────────────────────────────────
  # Runs on every push that touches the channel files. Standard GitHub-hosted
  # runner — no secrets required.
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: channels.md is non-empty
        run: |
          test -s channels.md || { echo "channels.md missing or empty"; exit 1; }
          echo "channels.md: $(wc -l < channels.md) lines"

      - name: channels.txt is non-empty
        run: |
          test -s channels.txt || { echo "channels.txt missing or empty"; exit 1; }
          echo "channels.txt: $(wc -l < channels.txt) URLs"

      - name: All lines in channels.txt are t.me URLs
        run: |
          bad=$(grep -v '^https://t\.me/' channels.txt | grep -v '^$' || true)
          if [ -n "$bad" ]; then
            echo "Invalid lines:"; echo "$bad"; exit 1
          fi
          echo "All URLs are well-formed t.me links."

      - name: No duplicate URLs in channels.txt
        run: |
          dups=$(sort channels.txt | uniq -d)
          if [ -n "$dups" ]; then
            echo "Duplicate URLs:"; echo "$dups"; exit 1
          fi
          echo "No duplicates."

  # ── Regenerate (optional, self-hosted) ──────────────────────────────────
  # Only runs when triggered manually from the GitHub UI. Requires a
  # self-hosted runner attached to this repo that can reach the TeleCrime
  # database. Replaces the host-cron workflow if you prefer GitHub-driven
  # regeneration.
  regenerate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, telecrime]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate channel lists from the database
        run: |
          uv run python -m telecrime channels-export --output-dir .

      - name: Commit and push
        run: |
          git add channels.txt channels.md
          git -c user.name='Telecrime Bot' -c user.email='bot@telecrime.local' \
            commit -m 'chore: update channel lists [auto]' --allow-empty
          git push
        env:
          TELECRIME_DATABASE_URL: ${{ secrets.TELECRIME_DATABASE_URL }}
